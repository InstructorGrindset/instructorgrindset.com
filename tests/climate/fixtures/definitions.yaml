# Synthetic test definitions. Same shape as the block suggested for config/definitions.yaml,
# with small storm counts so two season fixtures produce density values.
snow:
  powder_day_in: 6
  banner_day_in: 12
density_classes_pct:
  dry_below: 7
  moist_above: 12
climate:
  period_seasons: 25
  era5_lag_days: 7
  storm_min_daily_in: 1.0
  min_month_coverage: 0.9
  min_storms_per_month: 2
  density_estimate_method: anderson_1976
  era5_snow_elevation_band_ft: 1000
  low_relief_max_vertical_ft: 1500
  low_relief_max_base_ft: 4000
  validation_flag_pct: 35
  validation_suppress_pct: 50
  snotel:
    radius_km: 25
    elevation_band_below_ft: 1500
    elevation_band_above_ft: 3500
    max_candidates: 3
    storm_min_daily_depth_gain_in: 1
    min_storm_depth_gain_in: 3
    density_min_pct: 2
    density_max_pct: 40
    swe_noise_tolerance_in: 0.1
    max_daily_depth_gain_in: 40
    min_valid_storms: 5
    min_record_seasons: 2
    swe_min_daily_gain_in: 0.1
    swe_max_daily_gain_in: 6.0
    max_daily_new_snow_in: 60
    rain_snow_threshold_c: 1.0
    lapse_rate_c_per_km: 6.5
