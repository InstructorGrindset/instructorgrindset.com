# Career Map definitions (ROADMAP Section 6).
# Every threshold, weight and assumption the pipeline or the UI uses lives here.
# Loaded and validated by pipeline/config.py; unknown keys are an error.
version: 1

snow:
  # A powder day is 6 in or more of new snow in 24 hours.
  powder_day_in: 6
  # A banner day is 12 in or more of new snow in 24 hours.
  banner_day_in: 12
  window_hours: 24

density:
  # Water content of new snow, percent (change in SWE / change in snow depth per storm).
  # dry: below dry_max_pct; average: dry_max_pct to moist_min_pct; moist: above moist_min_pct.
  dry_max_pct: 7
  moist_min_pct: 12

season:
  # Season length is the median of the last N seasons' open to close, where data exists.
  length_rule: median_open_to_close
  lookback_seasons: 10

display:
  # Highest confidence wins, per field.
  priority: [published, reported, estimated]
  # resorts.geojson size_rank (1 to 5) from skiable acres: rank = 1 + number of breaks <= acres.
  # Null acres gives rank 1. Display bucketing only, not a resort fact.
  size_rank_acres_breaks: [500, 1500, 3000, 5000]

reports:
  # A field gains a Reported value only with this many approved reports; shown as a range only.
  aggregation_min: 3

submissions:
  # URL the map report form posts to (pay, rent, housing reports). The backend is the owner's choice;
  # the form stays hidden while this is null.
  endpoint: null

staleness:
  # Flag any record whose verified date is older than this.
  max_age_months: 18

matching:
  # Tier A to OpenSkiMap de duplication: an OpenSkiMap area within radius_km of a Tier A
  # base point (or containing it) whose name similarity (0 to 1) is at least
  # name_similarity_min is the same resort.
  radius_km: 5
  name_similarity_min: 0.6
  # Names this similar are the same resort even a little further away
  # (large resorts whose OpenSkiMap centroid sits away from the base area).
  strong_name_similarity_min: 0.9
  strong_name_radius_km: 15

openskimap:
  # Tier B extract rules (pipeline/openskimap.py filter_us).
  # Drop areas with no mapped lift and no mapped downhill run (mostly skimap.org stubs
  # that duplicate a mapped area or describe a closed hill).
  require_mapped_lifts_or_runs: true
  # Merge areas this close together whose names are this alike (0 to 1); the better mapped one is kept.
  dedupe_radius_km: 2
  dedupe_name_similarity_min: 0.8

ownership:
  # Every resort in data/raw/ownership/*.yaml needs a Tier A record (operator compensation).
  # warn while research is in progress; fail once the Vail and Alterra lists are complete.
  missing_tier_a_record: fail

professionalism:
  # Score from 0 to 100, weighted from the components below.
  # Alexandre sets these weights in Phase 4. Do not fill them in before then.
  scale_min: 0
  scale_max: 100
  weights:
    cert_pay_differential: null
    paid_training_hours: null
    examiner_trainer_presence: null
    private_lesson_share: null
    year_round_staff: null
    clinic_access: null
  # score = 100 x sum(weight x value) / sum(weight) over components that have a value
  # (each value is normalised 0 to 1 in data/raw/career). A resort with fewer components
  # than min_components shows insufficient_data. Null until Alexandre sets it (weights_unset).
  min_components: null

lucrativeness:
  # Owner decision 4 (2026-10-13). Season savings before tax, USD:
  #   season months = season length days / days_per_month when sourced, else default_season_months
  #   earnings      = hourly x hours_per_week x (season months x weeks_per_month)
  #   savings       = earnings + tips - average rent x season months
  # mid and high use the top of the posted wage scale (highest hourly_high of the displayed pay rows);
  # low uses the bottom (lowest hourly_low). No food, transport, pass or gear offsets.
  # Average rent follows rent.lucrativeness_rent. Computed with pipeline/season_income.py (the calculator's model).
  assumptions:
    hours_per_week: 40          # standard full time hours (ROADMAP Section 6)
    default_season_months: 5    # when the resort has no sourced season length
    days_per_month: 30.4
    weeks_per_month: 4.33       # same as the Season Income Calculator
    # Season tips (USD). Included only from a sourced figure or an aggregate of 3+ reports; null means
    # "Tips are not included yet". There is no tips data yet.
    tips_season_usd: null

rent:
  # Order of baseline values used for a housing site with no published rent (shown as
  # confidence estimated with the baseline source): fmr_studio, fmr_one_br, fmr_two_br, acs_median.
  baseline_preference: [fmr_studio, acs_median]
  # Average rent for lucrativeness (owner decision 4), first available wins: the mean of the resort's
  # employee housing rent mids (display priority applies), then the county ACS median gross rent,
  # then HUD FMR one bedroom. Other steps: reported_area, baseline (baseline_preference), fmr_studio, fmr_two_br.
  lucrativeness_rent: [employee_housing, acs_median, fmr_one_br]
  # Data vintages fetched by `python -m pipeline.rent fetch`. hud_fmr_year null means HUD's latest.
  hud_fmr_year: null
  acs_year: 2024
  acs_dataset: acs/acs5

transit:
  # Stops within this distance of a housing site or the base area are kept in the transit extract.
  search_radius_km: 2
  # Bus commute = walk to stop + scheduled ride + walk from stop, with no waiting time.
  # Alexandre sets these; bus commutes stay null until then.
  walk_speed_kmh: null
  max_walk_km: null

trailmap:
  # Douglas Peucker tolerance for OpenSkiMap run geometry in the trail map popup (metres).
  # 6 m (about 1.5 px at zoom 15) keeps run shapes readable and big resorts near 150 KB.
  simplify_tolerance_m: 6

routing:
  # Drive time, distance and route geometry (housing to base area) and drive isochrones around the base.
  # provider: valhalla | osrm | ors. OSRM has no isochrones. api_key_env names the environment variable
  # holding a key (ORS needs one; the public Valhalla and OSRM servers do not).
  provider: valhalla
  base_url: https://valhalla1.openstreetmap.de
  api_key_env: null
  isochrone_minutes: [15, 30, 45]
  timeout_s: 30

career:
  # Tag vocabularies for data/raw/career and data/raw/tier_a. Unknown tags fail the build.
  vocab:
    # client profiles (ROADMAP Section 1)
    client_profiles:
      - destination_families
      - local_kids_programs
      - adaptive
      - race
      - freestyle
      - international
      - uhnw_privates
    # Alexandre fills these lists.
    enthusiast_types: []
    professional_types: []

# Phase 3 climate ETL settings. Read and validated by pipeline/climate/definitions.py
# (owned by the climate ETL); pipeline/config.py passes this block through unchanged.
climate:
  period_seasons: 25            # climatology length in full ski seasons
  era5_lag_days: 7              # wait this long after Sep 30 before a season counts as complete
  storm_min_daily_in: 1.0       # a storm is consecutive days with at least this much new snow
  min_month_coverage: 0.9       # share of days with data before a season month counts
  min_storms_per_month: 5       # storms needed before a month gets a density value
  density_estimate_method: anderson_1976   # or hedstrom_pomeroy_1998
  # ERA5 snowfall is kept only where no usable SNOTEL station exists and either the
  # ERA5 grid cell height is within this band of the resort base, or the resort is low relief.
  era5_snow_elevation_band_ft: 1000
  low_relief_max_vertical_ft: 1500   # low relief: vertical under this ...
  low_relief_max_base_ft: 4000       # ... and base under this
  validation_flag_pct: 35       # flag annual totals this far from the published annual snowfall
  validation_suppress_pct: 50   # null monthly snowfall when the annual total is this far off
  open_meteo:
    # Weighted calls per day allowed when OPEN_METEO_API_KEY is set (paid plan, customer endpoint).
    # null keeps the free tier limits even with a key. Set it from the plan the owner buys.
    paid_daily_budget: null
  snotel:
    radius_km: 25               # search radius around the resort base
    elevation_band_below_ft: 1500   # station may sit this far below the resort elevation
    elevation_band_above_ft: 3500   # station may sit this far above the resort elevation
    max_candidates: 3           # stations tried, nearest first
    storm_min_daily_depth_gain_in: 1   # daily depth gain that marks a storm day
    min_storm_depth_gain_in: 3  # storms with less total depth gain are dropped
    density_min_pct: 2          # QC lower bound for storm density
    density_max_pct: 40         # QC upper bound for storm density
    swe_noise_tolerance_in: 0.1 # a daily SWE drop larger than this inside a storm is sensor noise
    max_daily_depth_gain_in: 40 # a daily depth jump above this is a sensor spike
    min_valid_storms: 20        # station is usable with at least this many QC passed storms
    min_record_seasons: 10      # station needs this many seasons of daily SWE in the period
    swe_min_daily_gain_in: 0.1  # smallest daily SWE gain counted as snowfall (WTEQ precision is 0.1 in)
    swe_max_daily_gain_in: 6.0  # a daily SWE gain above this is a sensor spike
    max_daily_new_snow_in: 60   # cap on derived daily new snow
    rain_snow_threshold_c: 1.0  # SWE gains without a depth gain count as snow at or below this air temperature
    lapse_rate_c_per_km: 6.5    # standard atmosphere lapse rate, ERA5 temperature to station elevation
