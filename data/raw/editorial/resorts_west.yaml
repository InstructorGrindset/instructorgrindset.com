  id: taos
  overview_md: "Taos Ski Valley is a village and ski resort in Taos County, New Mexico. Ernie and Rhoda Blake founded it in 1955, and they lived in an eleven foot camper before any lodge was finished. In 2006, 51 percent of its 110 trails were rated advanced or expert. Taos banned snowboarding until March 2008. Its Kachina lift reaches 12,481 feet. The Blake family sold Taos Ski Valley, Inc. to conservationist Louis Bacon in December 2013."
  culture_md: "Tourism is the village's main industry. In the 2011 to 2012 season the ski company employed about 700 people in winter, and about $47 million is spent in the village economy in an average year. The village had 77 residents in 2020. The town of Taos has a long reputation as an artist colony and counterculture haven next to Taos Pueblo, a UNESCO World Heritage Site. A fare free bus runs seasonally from Taos to the ski valley."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
