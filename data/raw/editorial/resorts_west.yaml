  id: ski-cooper
  overview_md: "Ski Cooper sits at Tennessee Pass near Leadville, Colorado, between the San Isabel and White River national forests. It opened as Cooper Hill Ski Area in 1942 and served as the training site for the 10th Mountain Division, based at nearby Camp Hale during World War II. Lake County owns it, and Cooper Hill Ski Area, a nonprofit with a volunteer board, manages it. It is among the most affordable ski areas in Colorado, second only to Howelsen Hill."
  culture_md: "Ski Cooper markets itself as a family resort because of its affordability and accessibility. Leadville, at 10,119 feet, is the highest incorporated city in the U.S. and had 2,633 residents in 2020. It is a former silver mining town with a historic district, and after the Climax Mine market collapsed in 1981 the town turned to tourism and outdoor recreation. Each March, Leadville holds a skijoring event on Harrison Avenue, run since 1949."
