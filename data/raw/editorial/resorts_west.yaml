  id: schweitzer
  overview_md: "Schweitzer sits in the Selkirk Mountains of north Idaho, 11 miles northwest of Sandpoint, overlooking Lake Pend Oreille. It opened as Schweitzer Basin in the fall of 1963 and is Idaho's largest ski resort, with 2,900 acres, 92 named runs, 10 lifts and over 300 inches of average snowfall. Alterra Mountain Company agreed to buy it in June 2023, after it joined the Ikon Pass. The purchase drew a mixed local reaction, with some passholders pleased and others worried about crowding."
  culture_md: "Schweitzer turned Sandpoint into a year round tourism destination. Sandpoint had 8,639 residents in 2020, and its economy rests on forest products, light manufacturing, tourism, recreation and government. The town holds a Winter Carnival each February and the Festival at Sandpoint in August, and it has a strong arts community. To meet a critical workforce housing shortage, the resort broke ground in July 2021 on a $22 million, 84 unit apartment complex in Ponderay. Amtrak's Empire Builder stops in Sandpoint."
