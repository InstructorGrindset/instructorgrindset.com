  id: mt-hood-meadows
  overview_md: "Mount Hood Meadows sits on the southeast face of Mount Hood in northern Oregon and is the largest of the mountain's ski resorts, with 2,150 skiable acres. It lies about 67 miles east of Portland and 35 miles from Hood River on Oregon Route 35. Skiers first used the resort in December 1967. It has alpine and Nordic areas and night skiing. Overnight guests stay at Timberline Lodge, Cooper Spur or condos in Government Camp."
  culture_md: "Many buses serve Meadows, including Columbia Area Transit from the Hood River side. Hood River, a city of 8,313 in 2020, built its economy on agriculture, tourism and sports recreation, and tourism boomed after windsurfers and kiteboarders discovered the Columbia Gorge winds. Since the late 1990s aerospace firms have become some of its largest employers. On the west side, Government Camp is the only town within 5 miles of Mount Hood and serves as its ski town; it had 179 residents in 2020."
