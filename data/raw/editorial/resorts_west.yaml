  id: snowbasin
  overview_md: "Snowbasin sits on Mount Ogden in Weber County, Utah, 33 miles northeast of Salt Lake City on the east side of the Wasatch Range. It opened in 1939 as part of an Ogden effort to restore the Wheeler Creek watershed, and it is one of the oldest continuously operating ski areas in the U.S. Earl Holding, owner of Sun Valley, bought it in October 1984. After his investment in lifts and snowmaking, it hosted the 2002 Olympic downhill, combined and super G."
  culture_md: "M. Earl Miller ran the Snowbasin ski school from the mid 1950s until 1987 and helped draft the PSIA American Ski Technique in 1961. SKI Magazine, Outside and USA Today ranked Snowbasin the top ski resort in the U.S. in 2025. The resort sits above Ogden Valley, where the town of Huntsville had 573 residents in 2020. Huntsville is home to the Shooting Star Saloon, the oldest continuously operating bar west of the Mississippi."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
