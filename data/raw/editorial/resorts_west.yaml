  id: bridger-bowl
  overview_md: "Bridger Bowl is a locally owned nonprofit ski area in the Bridger Range, 16 miles north of Bozeman, Montana. It opened to the public in 1955 as Bozeman's first ski area. It is known for The Ridge, expert hike terrain that requires an avalanche beacon and shovel. The Schlasman's lift, opened for 2008 to 2009, added 311 acres of expert only terrain. Visitation reached a record 377,663 skiers in the 2022 to 2023 season."
  culture_md: "Bridger Bowl serves the local population of Gallatin County, including Montana State University, and it aims to give locals affordable skiing. Since 1988 a blue beacon atop the Baxter Hotel in downtown Bozeman flashes when the area gets two inches of new snow. Montana State has hosted the NCAA Skiing Championships eight times, all at Bridger Bowl. Bozeman had 53,293 residents in 2020, and its top employers include Bozeman Health and Montana State University."
