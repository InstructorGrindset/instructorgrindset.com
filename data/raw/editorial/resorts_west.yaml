  id: yellowstone-club
  overview_md: "The Yellowstone Club is a private residential club, ski resort and golf resort in Madison County, Montana, just west of Big Sky. Most of its runs are on Pioneer Mountain, with a 9,859 foot summit, and its lifts tie into Big Sky Resort along a five mile shared border. Developer Tim Blixseth assembled the land. Out of bankruptcy in June 2009, CrossHarbor Capital Partners, led by club member Sam Byrne, bought the club for $115 million."
  culture_md: "The club is rated among the top 10 lifestyle estates in the world. By late 2014 it had more than 500 member households, and members have included Bill Gates and Mark Zuckerberg. Almost 650 people work at the club in peak season. Big Sky lies 45 miles by road from Bozeman."
