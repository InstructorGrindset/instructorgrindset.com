  id: sun-valley
  overview_md: "Sun Valley is the ski resort on Bald Mountain, or Baldy, next to Ketchum in Idaho's Wood River Valley. Union Pacific chairman W. Averell Harriman opened it in 1936 as the first destination winter resort in the U.S., and Baldy opened for lift served skiing in 1939 to 1940. The mountain has a 9,150 foot summit and 3,400 feet of vertical, with long runs at a steady pitch. The Holding family owns the resort, which Earl Holding bought in 1977."
  culture_md: "Sun Valley has been a seasonal home to the rich and famous since Ernest Hemingway brought it to public attention in the late 1930s. Harriman invited Hollywood celebrities to promote the resort, and Hemingway later moved to Ketchum. Ketchum had 3,555 residents in 2020, and Sun Valley had 1,783, with 66.6 percent of its housing units vacant. The area hosts the Sun Valley Music Festival, the Sun Valley Film Festival and Ketchum's Wagon Days each Labor Day weekend."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
