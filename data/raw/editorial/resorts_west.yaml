  id: heavenly
  overview_md: "Heavenly Mountain Resort straddles the California and Nevada border above the south shore of Lake Tahoe. It opened as Heavenly Valley on December 15, 1955, and now has 97 runs and 30 lifts across four base areas in both states. Its 10,067 foot top is the highest of the Lake Tahoe resorts, and it averages 360 inches of snow a year. Vail Resorts has owned it since 2002 and ranks it the twelfth most visited mountain resort in the U.S. for the 2025/2026 season."
  culture_md: "Heavenly sits beside South Lake Tahoe, a city of 21,330 in 2020, and Stateline, Nevada, home to the casinos. The east end of South Lake Tahoe centers on tourism, restaurants, hotels and the resort, and 41.9 percent of the city's housing units were vacant in 2020. Stateline's population swells in the busy winter and summer seasons. Vail Resorts points to Heavenly's nightlife and nearby casinos. Each ski season, skiers from Reno, Las Vegas, Los Angeles, San Diego, San Francisco and Sacramento come to the Tahoe slopes."
