  id: buttermilk
  overview_md: "Buttermilk sits about halfway between Aspen and Snowmass Village in Pitkin County, Colorado. Art Pfister developed it in 1958. It is often considered the easiest mountain in the Aspen area and has three sections: Tiehack, Main Buttermilk and West Buttermilk. Its base holds The Hideout, a play and learning area for ski school children ages 2 and a half to 6. The Aspen Skiing Company operates it. Buttermilk first hosted ESPN's Winter X Games in 2002, and the X Games has been held in Aspen every winter since."
  culture_md: null
  alexandre_take_md: null
