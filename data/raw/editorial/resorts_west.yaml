  id: june-mountain
  overview_md: "June Mountain sits near June Lake in the eastern Sierra Nevada, southeast of Yosemite National Park. It covers 1,500 acres across Rainbow Mountain and June Mountain, with 7 lifts and about 250 inches of snow a year. Mammoth Mountain operates it under a Forest Service permit, and it became part of Alterra Mountain Company with Mammoth in 2017. June closed for the 2012 to 2013 season, and after a citizen campaign it reopened in 2013 to 2014 with new snowmaking and a new chairlift."
  culture_md: "June Mountain is a favorite of locals for its small crowds and easy access to powder after storms. Tourism is June Lake's chief industry, and over half of its homes are second homes, mostly used in summer. The community had 611 residents in 2020. Most of the June Mountain winter workforce lives in employee housing in Mammoth and rides a daily employer bus."
