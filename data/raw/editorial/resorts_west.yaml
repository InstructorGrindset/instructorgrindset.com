  id: palisades-tahoe-alpine-meadows
  overview_md: "Alpine Meadows sits near the northwest shore of Lake Tahoe, with 2,400 acres, 13 lifts and 1,802 feet of vertical. It merged with Squaw Valley in 2012 and became part of Alterra Mountain Company in 2018. Today it operates with Palisades Tahoe as one resort on one season pass, and a gondola connects the two base areas. Together the two areas offer 6,000 skiable acres and over 270 trails."
  culture_md: "In a 1982 avalanche at Alpine Meadows, employee Anna Conrad was rescued after five days trapped in a collapsed resort building. The area shares Palisades Tahoe's market of Tahoe skiers from across California and Nevada, including San Francisco and Sacramento."
