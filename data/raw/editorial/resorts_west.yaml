  id: montana-snowbowl
  overview_md: "Montana Snowbowl sits in the Lolo National Forest 12 miles northwest of Missoula, Montana. It is known for long, steep expert runs such as West Bowl, a 2,600 foot vertical rise and throwback operations. Its lifts include three vintage Riblet double chairs, a Skytrac triple and a vintage Doppelmayr T bar. Base development is minimal, and the access road, improved in 2011, is still unpaved. Snowbowl opened in December 1962, promoted as having the most vertical in the Pacific Northwest."
  culture_md: "Snowbowl serves Missoula, the second most populous city in Montana with 73,489 residents in 2020. Missoula is home to the University of Montana, and its largest employers are the university, the public schools and two hospitals. The city also holds a U.S. Forest Service regional headquarters and the smokejumpers' headquarters. In summer Snowbowl runs one lift on weekends for hikers and mountain bikers."
