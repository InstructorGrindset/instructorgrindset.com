  id: keystone
  overview_md: "Keystone Resort sits in the town of Keystone in Summit County, Colorado. It spans three mountains, Dercum Mountain, North Peak and the Outback, reached from the River Run and Mountain House bases. Vail Resorts has owned and operated it since 1997. The company ranks Keystone the seventh most visited mountain resort in the U.S. for the 2025/2026 season and calls it the largest night skiing area in Colorado. Its Kidtopia program offers activities for kids on and off the mountain."
  culture_md: "Keystone incorporated as a town in April 2023. The former Keystone census area had 1,369 residents in 2020, and 82.1 percent of its housing units were vacant. The Keystone Conference Center is the largest conference facility in the Colorado Rocky Mountain region. In February 2025 the Keystone ski patrol union reached an agreement with Vail Resorts that added wage increases and housing assistance."
