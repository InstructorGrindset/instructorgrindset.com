  id: arapahoe-basin
  overview_md: "Arapahoe Basin, often called A Basin or The Basin, sits south of Loveland Pass on U.S. Highway 6 in Summit County, Colorado, about 68 miles west of Denver. It is known for its extended season and extreme terrain, and it mostly draws advanced and expert skiers. Lifts often run from mid October into June, and the 2018 to 2019 season lasted 258 days. Larry and Marnie Jump, Max Dercum and Sandy Shaufler started it, and it opened in 1946. Alterra Mountain Company bought it in November 2024."
  culture_md: "Arapahoe Basin left Vail Resorts' Epic Pass after the 2018 to 2019 season and joined the Ikon Pass. Its Il Rifugio, at 12,456 feet, is the highest elevation restaurant in North America. Summit County had 31,055 residents in 2020, and 58.7 percent of its housing units were vacant. In nearby Frisco, housing costs by 2025 had forced many workers, ski instructors among them, into homelessness while they kept their jobs."
