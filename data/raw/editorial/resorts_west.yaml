  id: snow-valley
  overview_md: "Snow Valley Mountain Resort sits in Running Springs, California, 17 miles west of Big Bear Lake, in the San Bernardino National Forest. It is the longest continually operating ski resort in Southern California and the first in the San Bernardino Mountains. Norwegian American ski jumper Johnny Elvrum bought and expanded it in 1940. Alterra Mountain Company bought it in January 2023, and it now runs with Bear Mountain and Snow Summit as part of Big Bear Mountain Resort. It has 12 lifts, including one high speed six pack."
  culture_md: "Running Springs had 5,268 residents in 2020. Its service businesses cater to tourists visiting the San Bernardino National Forest, a year round destination. With nearby communities it also forms a bedroom community for commuters who work in San Bernardino. The Rim, as locals call it, runs about 30 miles from Crestline to Big Bear."
