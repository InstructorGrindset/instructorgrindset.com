  - ed-west-wiki-ketchum-idaho
- target: resort
  id: dollar-mountain
  overview_md: "Dollar Mountain is the treeless beginner and lower intermediate hill of the Sun Valley ski resort in Idaho. It has a 628 foot vertical drop, four chairlifts, a magic carpet and a terrain park on the Half Dollar lift. The world's first chairlifts were installed on Sun Valley's Proctor and Dollar mountains in the fall of 1936. Dollar Mountain Lodge opened in November 2004 and serves as headquarters of the Sun Valley Ski School. The Holding family owns the resort."
  culture_md: null
  alexandre_take_md: null
