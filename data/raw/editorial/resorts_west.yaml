  id: snowmass
  overview_md: "Snowmass is the largest of the four Aspen Snowmass ski areas and sits in the Town of Snowmass Village near Aspen, Colorado. It opened in December 1967 and hired Olympic medalist Stein Eriksen to direct its ski school. The Aspen Skiing Company owns and operates it. The company, owned by the Crown family of Illinois, also runs the Ski and Snowboard Schools of Aspen Snowmass and a Limelight hotel in Snowmass."
  culture_md: "Snowmass Village had 3,096 residents in 2020, and 46.6 percent of its housing units were vacant. The village has seen a building boom of condominiums, luxury homes, mountainside mansions and the new Base Village, plus new Westin and Viceroy hotels. It is also seeing a rising influx of wealthy tourists and skiers. The median single family home price there was $5.2 million in 2021."
  alexandre_take_md: null
  status: reviewed
