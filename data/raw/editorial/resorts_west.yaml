  id: alyeska
  overview_md: "Alyeska Resort sits in Girdwood, about 30 miles from downtown Anchorage, on Mount Alyeska in the Chugach Mountains. It is the largest ski area in Alaska. The first chairlift opened in 1959, and the 1960 Roundhouse at the top is on the National Register of Historic Places. The mountain has a much higher share of advanced and expert runs than most North American mountains, and snowfall can top 650 inches at the top of the Glacier Bowl Express. In October 2018 the resort announced a contract to sell substantially all its assets to Pomeroy Lodging."
  culture_md: "Girdwood began as a supply town for 1890s gold miners and moved up the valley after the 1964 earthquake. The resort became an international destination and long shaped the town around seasonal vacation homes. The Alyeska Prince Hotel, opened in the 1990s, shifted Girdwood toward a year round economy. Housing for resort workers is a recurring debate, and many workers over the years have camped illegally on public lands. The valley had an estimated 1,742 residents in 2019."
