  id: breckenridge
  overview_md: "Breckenridge Ski Resort spreads across five peaks of the Tenmile Range above the town of Breckenridge, the county seat of Summit County, Colorado. Its base sits at 9,600 feet, just west of the Continental Divide. Skiing began on Peak 8 in December 1961. The resort installed the world's first high speed detachable quad in 1981. Vail Resorts owns and operates it and ranks it the third most visited mountain resort in the U.S. for the 2025/2026 season."
  culture_md: "Breckenridge was founded in 1859 to serve gold miners, and historic clapboard and log buildings line Main Street. The town had 5,078 residents in 2020 and many part time residents with vacation homes; 69.1 percent of its housing units were vacant. Breckenridge holds Ullr Fest each December, honoring the Norse god Ullr, and the Breckenridge Festival of Film each September. Vail Resorts owns half of Breckenridge Terrace, an employee housing complex."
