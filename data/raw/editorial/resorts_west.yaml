- target: resort
  id: beaver-creek
  overview_md: "Beaver Creek Resort sits about two miles south of Avon in Eagle County, Colorado. It links three villages: Beaver Creek Village, Bachelor Gulch and Arrowhead. Vail Resorts owns and operates it. Beaver Creek hosted the World Ski Championships in 1989, 1999 and 2015, and it holds the Birds of Prey World Cup downhill early each season. Vail Resorts ranks it the thirteenth most visited mountain resort in the U.S. for the 2025/2026 season."
  culture_md: "Vail Resorts describes Beaver Creek as a European style resort with several villages and a children's ski school with its own children's gondola. From 2026/2027 every private lesson there becomes the Epic Ascent product, with concierge support. Avon, the gateway town, had 6,072 residents in 2020. Its largest employers in 2020 were the Westin Riverfront Resort and Spa, Walmart and City Market. Eagle County Airport is 27 miles west of Avon and Denver International Airport is 130 miles east."
  alexandre_take_md: null
