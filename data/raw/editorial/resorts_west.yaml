  id: solitude
  overview_md: "Solitude Mountain Resort sits in Big Cottonwood Canyon, thirty miles southeast of Salt Lake City. With 1,200 acres and 2,047 feet of vertical, it is one of the smaller resorts near Salt Lake City, along with its neighbor Brighton. Half of its slopes are rated beginner or intermediate, the highest share in the Salt Lake area. Robert Barrett began building it in 1956. Deer Valley bought it in 2015, and Alterra Mountain Company agreed to buy it in 2018."
  culture_md: "Solitude is a family oriented mountain. It shares the Solbright Pass with Brighton, which covers both resorts for a small surcharge. Solitude was the first Utah resort to charge for parking, up to $20 a day starting in November 2019. It hosted snowboard cross and ski cross at the 2019 FIS Freestyle and Snowboarding World Championships, and it runs a Nordic center."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
  source_ids:
  - ed-west-wiki-solitude-mountain-resort
- target: resort
  id: brighton
  overview_md: "Brighton Ski Resort sits in Big Cottonwood Canyon in Brighton, Utah, about 30 miles from downtown Salt Lake City. It was the first ski resort in Utah, started in 1936 when Alpine Ski Club members built a rope tow from wire and an old elevator motor. Boyne Resorts owns and operates it. Boyne bought Brighton in 1986, sold it in 2007 while leasing it back, and bought it again in May 2018. The whole resort sits on national forest land."
  culture_md: "From the early 1990s through the 2000s, many top professional and amateur snowboarders called Brighton home. The Disney Channel movies Johnny Tsunami and Cloud 9 were filmed here. Brighton and neighboring Solitude share the Solbright Pass. The town of Brighton had 432 residents in 2020 and is part of the Salt Lake City metro area."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
