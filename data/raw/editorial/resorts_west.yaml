  id: woodward-park-city
  overview_md: "Woodward Park City is an action sports training and recreation center in Park City, Utah. POWDR opened it in December 2019 as a youth sports complex. It belongs to the Woodward network that POWDR built after buying a majority share of Camp Woodward in 2011, alongside Woodward Copper, Woodward Tahoe and Woodward Mt. Bachelor. Park City also holds Park City Mountain, Deer Valley and Utah Olympic Park."
