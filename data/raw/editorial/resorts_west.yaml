  id: timberline-palmer-summer
  overview_md: "The Palmer Snowfield on Mount Hood's south slope gives Timberline lift served skiing through the summer. The Palmer chairlift, built in 1983, climbs to 8,500 feet and runs from spring to early fall when conditions allow. Summer skiing and race camps began at Timberline in 1956. Dozens of summer camps enroll thousands of athletes, and a busy midweek day can see 1,500 riders. Ski racing camps are the most popular, followed by snowboard and freeski camps. The season usually ends in August or September."
  culture_md: "Summer at Timberline centers on week long camps, with snow sessions in the morning and rafting, biking, hiking or trampoline in the afternoon. Lifts are busiest Monday through Friday in summer because of the camps. Mount Hood Summer Ski Camps have hosted campers since the 1970s. The snowfield is shrinking each year, and salting to extend the season adds pollution to the Salmon River."
