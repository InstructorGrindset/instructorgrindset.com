  id: howelsen-hill
  overview_md: "Howelsen Hill Ski Area sits in the town of Steamboat Springs, Colorado. It opened officially in 1914 and is the oldest continuously operating ski area in North America. Norwegian immigrant Carl Howelsen brought ski jumping to Steamboat in 1913, and the hill now bears his name. It holds the largest natural ski jumping complex in North America, with the largest jump at HS127. The City of Steamboat Springs owns and operates it through its Parks, Open Space and Recreation Department."
  culture_md: "Howelsen Hill is the home area of the Steamboat Springs Winter Sports Club, which has produced 88 Winter Olympians. The club's alpine branch alone has about 400 children. The hill has sent more skiers to international competition than any other area in North America. Carl Howelsen also founded Steamboat's annual Winter Carnival, and the hill has lights for night skiing."
