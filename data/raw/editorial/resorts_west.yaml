  id: timberline-lodge
  overview_md: "Timberline Lodge ski area sits on the south face of Mount Hood, about 60 miles east of Portland, below the Works Progress Administration lodge that President Roosevelt dedicated in 1937. Most of its terrain lies below the lodge. It opened as Oregon's first destination ski resort with a portable rope tow, and its Magic Mile chairlift, built in 1938, was then the longest chairlift in existence. The lodge is publicly owned and privately operated; Richard Kohnstamm took over in 1955, and his family still manages the resort."
  culture_md: "Timberline Lodge is a National Historic Landmark that draws two million visitors a year, and local artisans built and furnished it during the Great Depression. It served as the exterior of the Overlook Hotel in The Shining. Government Camp, the de facto ski town of Mount Hood, had 179 residents in 2020. The Golden Rose Ski Classic, run here since 1936 as part of the Portland Rose Festival, is the oldest known organized ski race in America."
