- target: resort
  id: aspen-highlands
  overview_md: "Aspen Highlands sits in Aspen, Colorado, and is famous for Highland Bowl and its other experts only terrain. Aspen resident Whip Jones founded it in 1958. The Aspen Skiing Company took over ownership and operation in 1993, and Highlands is now one of the four Aspen Snowmass areas. Most Highland Bowl terrain is reached by hiking from the top of Loge Peak, and the hike brings the skiable vertical to 4,342 feet. Since December 2017 its trail map has shown intermediate and expert terrain only."
  culture_md: "Highlands draws expert skiers to the hike into Highland Bowl, which fully opened in 2002. A memorial near the top of the Loge Peak lift honors three ski patrollers killed in a 1984 avalanche. Aspen workers face severe housing costs. Rising property values and second homes push many workers into commutes from Snowmass, Basalt, Carbondale and Glenwood Springs, and even deed restricted employee homes can cost close to $1 million."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
