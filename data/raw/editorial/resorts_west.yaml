  id: winter-park
  overview_md: "Winter Park Resort sits in Grand County, Colorado, just off U.S. Highway 40, about a ninety minute drive from Denver. It opened for the 1939 to 1940 season. The City and County of Denver owned and ran it until 2002 and still owns it, and Alterra Mountain Company manages it. Its Mary Jane area, opened in 1975, has a separate base and is known for moguls, trees and harder terrain. The resort has 23 lifts and is home to the National Sports Center for the Disabled, one of the world's largest and oldest disabled skiing programs."
  culture_md: "For nearly 70 years many Denver residents rode the Ski Train to the base through the Moffat Tunnel, and Amtrak's Winter Park Express now runs seasonal ski trains. The town of Winter Park had 1,033 permanent residents in 2020, and 81.3 percent of its housing units were vacant, so the seasonal population is much higher. Nearby Fraser, a town of 1,400, has grown with new condominiums. The Lift bus serves the town, and Bustang links it to Denver."
