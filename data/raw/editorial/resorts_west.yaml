  id: palisades-tahoe
  overview_md: "Palisades Tahoe sits in Olympic Valley, California, northwest of Tahoe City. Founded in 1949 as Squaw Valley, it hosted the 1960 Winter Olympics and took its current name in 2021. It is the largest ski complex in the Lake Tahoe region and is known for challenging terrain, with 3,600 acres across six peaks, a tram and the only funitel in the U.S. It averages 400 inches of snow and draws about 600,000 skiers a year. Alterra Mountain Company owns it, joined by gondola to Alpine Meadows."
  culture_md: "Skiing and racing culture shaped Olympic Valley long before the 1960 Games. The valley has about 924 year round residents and can swell to about 6,573 overnight with visitors. An appointed council of residents advises the Placer County supervisors, and in 2015 the county formation commission said it would vote against incorporation. Base village development plans have drawn opposition from conservation groups such as Sierra Watch. The resort works with the Washoe tribe on a cultural tour. Olympic Valley has hosted the Wanderlust music and yoga festival since 2009."
