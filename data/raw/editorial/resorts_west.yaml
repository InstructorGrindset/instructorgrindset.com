  id: alta
  overview_md: "Alta Ski Area sits in the town of Alta at the head of Little Cottonwood Canyon, Utah. It opened its first lift on January 15, 1939, making it one of the oldest ski areas in the U.S. It averages 543 inches of snow a year and is known for long, steep fall line pitches such as High Rustler and the Baldy Chutes. Alta is one of three U.S. ski areas that prohibit snowboarding. Private shareholders own it, led by the Laughlin family with 51 percent."
  culture_md: "Alta views itself as a locals and family oriented ski area, even with a reputation as one of the most challenging in bounds areas in the world. The town of Alta had 228 residents in 2020, and the ski area draws about 500,000 visitors a year. The base hotels are independently owned. In 1937 Salt Lake City lawyer Joe Quinney and local businessmen formed the Utah Winter Sports Association to develop skiing at Alta. A lift in Snowbird's Mineral Basin links the two areas."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
