  id: whitefish-mountain
  overview_md: "Whitefish Mountain Resort sits on Big Mountain in northwest Montana, west of Glacier National Park, 4 miles from the town of Whitefish and 21 miles north of Kalispell. Winter Sports, Inc. formed in 1947 as a public company of community shareholders to open Big Mountain. The resort hosted the U.S. Alpine Championships in 1949, and Olympic champion Tommy Moe learned to ski and race here. Big Mountain took its current name after billionaire Bill Foley became majority shareholder of Winter Sports, Inc. It has 14 lifts."
  culture_md: "Local people donated labor to build the resort, clearing slopes and helping push through the mountain road. Whitefish had 7,751 residents in 2020 and is known for environmentalism and protected trails. Its events include the Whitefish Winter Carnival, with a parade and a plunge into Whitefish Lake, and the Under the Big Sky Music Festival. Amtrak's Empire Builder stops in Whitefish on its Chicago to Seattle and Portland route."
