  id: mt-bachelor
  overview_md: "Mt. Bachelor sits on the north side of a Cascade Range stratovolcano in Central Oregon, about 22 miles west of Bend. Former 10th Mountain Division ski trooper Bill Healy founded it on December 19, 1958, with money raised from local investors. It is the largest ski resort in Oregon and the second largest single mountain ski resort in the U.S., behind Vail. Its season usually runs from mid November to the end of May, with over 462 inches of snow a year. POWDR has owned it since 2001."
  culture_md: "Tourism is one of Bend's largest sectors, and Mt. Bachelor brings in tourists from across Oregon, Washington and California. Bend had 99,178 residents in 2020 and is Central Oregon's largest city. In 2011 tourism employed 16 percent of the city's workforce, and families made up the largest group of visitors. Bend is known for its brewing culture, led by Deschutes Brewery. Some Bay Area and Seattle tech workers live in Bend for its outdoors and lower cost of living."
