  id: park-city
  overview_md: "Park City Mountain Resort sits in Park City, Utah, 32 miles east of Salt Lake City. It opened on December 21, 1963, as Treasure Mountain, funded partly by a federal program to revive the depressed mining town. Vail Resorts bought it in 2014 and linked it to neighboring Canyons by gondola, creating the largest lift served ski resort in the U.S. at 7,300 skiable acres. It holds several U.S. Ski Team training courses and hosted 2002 Olympic giant slalom and snowboarding events."
  culture_md: "Park City had 8,396 residents in 2020, and tourists far outnumber them. In 2021 data the city brought an average of $529.8 million a year to the Utah economy, and the town is now one of the most affluent resort towns in the U.S. The resort is a main employer for many residents. In December 2024, 200 ski patrollers struck for higher wages. The town is home to the U.S. Ski Team, Main Street shopping and dining, and the Kimball Arts Festival."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
