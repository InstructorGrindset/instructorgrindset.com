  id: sugar-bowl
  overview_md: "Sugar Bowl sits on Donner Pass near Norden, California, about 46 miles west of Reno on I 80. It opened on December 15, 1939. Austrian champion Hannes Schroll founded it with individual investors, and Walt Disney became a shareholder. It was the first ski area in California with a chairlift and the first on the West Coast with a gondola. Sugar Bowl is known for its history, advanced terrain and heavy snowfall, and it is one of the few privately owned resorts left in the Lake Tahoe area."
  culture_md: "Sugar Bowl is one of the closest ski areas to the San Francisco Bay Area, and many trails carry San Francisco names such as Nob Hill and Market Street. In its early years Hollywood guests came, and wearing suit jackets to dinner was the norm. Skiers from Sacramento and San Francisco skied the area before the resort opened, at the Klein ski school founded in 1936."
