  id: steamboat
  overview_md: "Steamboat Resort sits on Mount Werner in the Park Range, just east of Steamboat Springs in northwest Colorado. It opened on January 12, 1963, as Storm Mountain, largely built by locals Jim Temple and rancher John Fetcher. It has 297 named trails over 2,965 acres, with 44 percent rated advanced, and the Mavericks Superpipe. Alterra Mountain Company bought it from Intrawest in 2017, and the Steamboat Ski & Resort Corporation operates it. Steamboat Springs lies about 150 miles northwest of Denver."
  culture_md: "Steamboat Springs had 13,224 residents in 2020 and is the largest city in northwest Colorado. Ranching and mining built the regional economy and still have a large presence in the county. The town has produced more Winter Olympians than any other town in North America, and its Winter Sports Club trains on Mount Werner and Howelsen Hill. Housing is short: the median single family home price rose from $529,000 in 2019 to $829,000 in 2022. In 2024 voters blocked a plan for nearly 2,300 affordable worker homes."
