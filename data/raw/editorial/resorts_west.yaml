  id: mammoth-mountain
  overview_md: "Mammoth Mountain sits on the east side of the Sierra Nevada in the Inyo National Forest, in the town of Mammoth Lakes, California. It has 3,500 acres, 3,100 feet of vertical and an 11,059 foot summit, and it averages 400 inches of snow, with seasons that often run from November into May. Dave McCoy founded it, building the first lift in 1955. Starwood sold it in 2017 to the partnership that became Alterra Mountain Company. It hosts U.S. Grand Prix freestyle and snowboard events, and Chloe Kim trains here."
  culture_md: "Most Mammoth skiers come from the Los Angeles area, since Bay Area residents must cross four mountain passes to reach it. Mammoth Lakes, the only incorporated town in Mono County, had 7,191 residents in 2020, and 68.6 percent of its housing units were vacant. The town economy is primarily tourism, with summer camping, hiking and fishing. The tourist market has driven property values sharply higher. Eastern Sierra Regional Airport in Bishop has seasonal flights to Los Angeles, San Francisco and Denver."
