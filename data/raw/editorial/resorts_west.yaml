  id: usss-center-of-excellence
  overview_md: "The Center of Excellence is the national training and education facility of U.S. Ski & Snowboard, at 1 Victory Lane in Park City, Utah. The organization broke ground in July 2007 and moved in during May 2009. The center holds strength training areas, a gymnasium, a climbing wall, ski and snowboard ramps, trampolines, a nutrition center and rehabilitation facilities. It serves as a training base for elite athletes and an education center for athletes, coaches and clubs."
