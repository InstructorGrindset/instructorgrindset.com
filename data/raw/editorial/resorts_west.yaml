- target: resort
  id: snowbird
  overview_md: "Snowbird sits in Little Cottonwood Canyon in Utah, 24 miles from downtown Salt Lake City and 29 miles from the airport. It opened in December 1971 and runs almost entirely on private land. The resort has 2,500 acres and 3,240 feet of vertical from Hidden Peak, which tops 11,000 feet. Snowbird is mainly known for powder and challenging terrain, and it receives more than 500 inches of snow a year. POWDR lists Snowbird among its resorts."
  culture_md: "Snowbird operates year round, with hiking, mountain biking and fishing in summer. It sits on the eastern border of the Salt Lake City suburb of Sandy. Industry magazines often praise its snowfall, terrain and easy access from Salt Lake City International Airport. Snowbird owns Mineral Basin, a large bowl behind Hidden Peak, where a lift gives access to Alta. The Tram Club, a hot spot for locals since 1994, reopened in December 2022."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
