  id: snow-summit
  overview_md: "Snow Summit sits by Big Bear Lake in the San Bernardino Mountains of Southern California and was established in 1952. It is a mid sized resort with 240 skiable acres and 1,209 feet of vertical, and its snowmaking draws water from Big Bear Lake to cover all marked terrain. Mammoth Resorts bought it with Bear Mountain in 2014 for $38 million, and it became part of Alterra Mountain Company in 2017. It operates with Bear Mountain and Snow Valley as Big Bear Mountain Resort. Snow Summit hosted the first Winter X Games in 1997."
  culture_md: "Snow Summit is one of the most popular ski and snowboard destinations for people from the Los Angeles area. Big Bear Lake is a year round resort town of 5,046 residents in 2020, and the Big Bear Valley often hosts over 100,000 people on weekends. Big Bear Lake is Southern California's largest recreational lake."
