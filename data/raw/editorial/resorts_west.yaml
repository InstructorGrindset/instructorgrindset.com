  id: utah-olympic-park
  overview_md: "Utah Olympic Park is a winter sports complex northwest of Park City, Utah, 28 miles east of Salt Lake City, built for the 2002 Winter Olympics. Its ski jumps and sliding track hosted bobsleigh, skeleton, luge, ski jumping and Nordic combined. Since the Games it has run as a training center for athletes, with a summer aerial training splash pool on site. The Utah Athletic Foundation operates it. It is scheduled to host sliding, ski jumping, Nordic combined, snowboard cross and parallel, and ski cross events at the 2034 Winter Olympics."
