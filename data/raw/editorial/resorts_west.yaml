  id: stevens-pass
  overview_md: "Stevens Pass sits at the crest of Stevens Pass in the Washington Cascades, on U.S. Route 2, less than 85 miles from Seattle. It opened in 1937 and has 37 major runs on 1,125 acres, plus the Mill Valley backside and night skiing. Vail Resorts completed its purchase in August 2018 and added it to the Epic Pass. Vail Resorts notes its bowls, glades and faces and its lighted night terrain."
  culture_md: "Stevens is a day resort that draws heavily from the Seattle and Everett metro area by U.S. Route 2. In the 2021 to 2022 season, staffing shortages left only five lifts running. A petition gathered nearly 40,000 signatures in two weeks. A new general manager opened the 2022 to 2023 season fully staffed, with more employee housing and pay raises. Vail Resorts owns employee housing at the pass."
