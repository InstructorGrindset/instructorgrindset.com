  id: bogus-basin
  overview_md: "Bogus Basin sits in Boise County, Idaho, 16 road miles north of Boise, on the Boise Ridge above the Treasure Valley. Alf Engen chose the site in 1939, and it opened in December 1942. The Bogus Basin Recreation Association, a nonprofit, operates it on private and leased national forest land. It has 2,600 acres, 7 chairlifts, night skiing on 165 acres and 23 miles of Nordic trails. In 1998 it cut its adult season pass from $500 to $199, and resorts from coast to coast then lowered their pass prices."
  culture_md: "Bogus Basin overlooks Boise and the Treasure Valley, and its 1998 pass cut lifted skier visits from under 192,000 to over 303,000. Boise's metro area had about 476,000 people in 2024 and has been one of the fastest growing in the U.S. Major employers include Micron Technology, the state government and St. Luke's. Agribusiness magnate J. R. Simplot helped save the area when it struggled with debts in 1953, and the main lodge carries his name."
