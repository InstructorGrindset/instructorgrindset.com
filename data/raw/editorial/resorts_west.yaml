  id: big-sky
  overview_md: "Big Sky Resort sits on Lone Mountain in Big Sky, Montana, reached from Bozeman through Gallatin Canyon. It has 5,850 acres and 4,350 feet of vertical, and its Lone Peak Tram reaches expert terrain from the 11,166 foot summit. Former NBC anchor Chet Huntley founded the resort, which opened in December 1973. Boyne Resorts bought it in 1976 and owns it today. In 2013 Big Sky added the terrain of neighboring Moonlight Basin. It has one of the largest chairlift fleets in North America."
  culture_md: "Tourism is the main industry of Big Sky, an unincorporated community of 3,591 people in 2020, up from 2,308 in 2010. In 2020, 57.3 percent of its housing units were vacant. Bozeman, the fourth largest city in Montana, lies about 45 miles away. The Skyline bus links Bozeman and Big Sky, and Bozeman Yellowstone International Airport serves both. Big Sky shares a five mile border with the private Yellowstone Club, and the two lift systems connect."
