  id: grand-targhee
  overview_md: "Grand Targhee Resort sits on the west side of the Teton Range in Wyoming, near the small community of Alta. It lies 42 miles northwest of Jackson and is reached only from the west, through Driggs, Idaho. The resort averages over 500 inches of snow per season, and most of its slopes face west. It opened on December 26, 1969. George and Rose Gillett and their four sons bought it in June 2000."
  culture_md: "Teton Valley locals helped found Grand Targhee. East Idahoans formed Grand Targhee, Inc. in 1966, and its 900 plus members aimed to benefit the community and the regional economy. Driggs, the seat of Teton County, Idaho, had 1,984 residents in 2020, and Alta had 429. Valley events include the Teton Valley Hot Air Balloon Festival and the Plein Air Arts Festival. In summer the resort hosts music festivals, including a bluegrass festival."
  alexandre_take_md: null
