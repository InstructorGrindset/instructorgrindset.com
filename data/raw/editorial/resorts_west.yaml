  id: deer-valley
  overview_md: "Deer Valley Resort sits in Park City, Utah, 36 miles east of Salt Lake City. It is a ski only resort that emphasizes upscale lodging and amenities, and it is one of three U.S. resorts that prohibit snowboarding. Edgar Stern developed it, and it opened on December 26, 1981. Deer Valley hosted 2002 Olympic moguls, aerials and slalom. Its expansion into the former Mayflower area brought the resort to 4,300 acres by 2026. Alterra Mountain Company owns it."
  culture_md: "Deer Valley shares Park City with Park City Mountain, and the town draws an average of 600,000 tourists a year against about 8,000 residents. Park City is one of the most affluent resort towns in the U.S. Deer Valley regularly hosts FIS moguls and aerials competitions and is scheduled to host both events at the 2034 Winter Olympics."
  alexandre_take_md: null
