  id: copper-mountain
  overview_md: "Copper Mountain sits in Summit County, Colorado, about 75 miles west of Denver on I 70. It opened in November 1972 and has 2,465 acres under Forest Service lease. POWDR has operated it since buying it from Intrawest in December 2009. The Forest Service has called its layout the most organized of any ski resort: beginner runs lie to the west and difficulty rises to the east, with Tucker Mountain holding expert terrain. Copper has been an official U.S. Ski Team downhill training venue since 2011 to 2012."
  culture_md: "Copper's lodging and dining sit in three villages: East Village, Center Village and West Village. Frisco, a town of 2,913 in 2020, sits near Copper, Breckenridge, Keystone and Arapahoe Basin and draws skiers from around the world. By 2025 housing costs there had forced many workers, from ski instructors to emergency room nurses, into homelessness while they kept their jobs. Homeless resort employees may sleep in their cars in local lots if they can prove employment. Bustang buses link Frisco to Denver."
