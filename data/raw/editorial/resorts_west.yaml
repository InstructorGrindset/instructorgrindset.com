  id: aspen-mountain
  overview_md: "Aspen Mountain, called Ajax by many locals, rises directly above the city of Aspen in Pitkin County, Colorado. Walter Paepcke founded it in 1946 as the first ski area of the Aspen Skiing Company, and its first chairlift was then the longest in the world. Skiers ride up from the town center and ski the Little Nell run back into town. At 673 acres it is much smaller than nearby Snowmass. It is one of the four Aspen Snowmass areas the Aspen Skiing Company operates."
  culture_md: "The mountain keeps a homespun culture rooted in Paepcke's 1940s vision for Aspen. Homemade memorials to figures such as John Denver and Hunter S. Thompson dot its trees. Aspen grew from a silver mining camp into a ski town and cultural center, home to the Aspen Music Festival and School and the Aspen Institute. Since the 1970s it has drawn celebrities and the wealthy. Many people from the U.S. and abroad vacation there, especially in winter."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
  source_ids:
