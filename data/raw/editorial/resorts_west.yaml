  id: crystal-mountain
  overview_md: "Crystal Mountain sits in eastern Pierce County, Washington, southeast of Seattle in the Mount Baker Snoqualmie National Forest. It is the largest ski resort in Washington, reached from the Seattle and Tacoma metro area by State Route 410. Its Mt. Rainier Gondola, opened in 2010, is the state's only high speed gondola and runs year round to the summit. Crystal hosted the U.S. Alpine Championships in 1965 and 1968 and World Cup downhills in 1972. Alterra Mountain Company acquired it in 2018."
  culture_md: "Crystal is primarily a day use area for skiers from the Seattle and Tacoma metro area, with nine chairlifts and several hotels. Local racer Judy Nagel won two national titles here at sixteen. Its master development plan, the largest in Washington's history, includes employee housing."
