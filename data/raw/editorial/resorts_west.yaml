- target: resort
  id: vail
  overview_md: "Vail Ski Resort sits above the town of Vail in Eagle County, Colorado, 97 miles west of Denver on I 70. At 5,289 acres it is the third largest single mountain ski resort in the U.S., with the Front Side, the Back Bowls and Blue Sky Basin. Vail opened in late 1962, founded by Pete Seibert and local rancher Earl Eaton. Vail Resorts owns and operates it along with nearby Beaver Creek, Breckenridge and Keystone. The company ranks Vail the second most visited mountain resort in the U.S. for the 2025/2026 season."
  culture_md: "Vail Village follows Bavarian village styles with pedestrian streets, and it was built when the resort opened. The town economy relies heavily on tourism. Vail had 4,835 residents in 2020, and 67.3 percent of its 7,300 housing units were vacant. The median house price is over $1 million, and the town faces a worker shortage because housing is insufficient. Starting in 2026/2027, every private lesson at Vail becomes Vail Resorts' Epic Ascent product, with concierge support and gear rental."
  alexandre_take_md: null
