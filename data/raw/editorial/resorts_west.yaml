  id: powder-mountain
  overview_md: "Powder Mountain sits east of Eden, Utah, spanning Weber and Cache counties, 55 miles northeast of Salt Lake City International Airport. Its 12,000 acres make it one of the largest ski resorts in the U.S. It opened on February 19, 1972. Netflix cofounder Reed Hastings, a Powder homeowner, bought it in 2023 and serves as CEO and chairman. He introduced a blended public and private model. The resort has five public chairlifts and three lifts for homeowners, plus cat skiing."
  culture_md: "The summit holds Powder Haven, a 600 family private ski community. Men's Journal named Powder the best ski resort to avoid the crowds in 2024, and SKI Magazine ranked it first in its 2023 Top 30 Resorts in the West. Eden, in Ogden Valley, had 690 residents in 2020 and is part of the Ogden metro area."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
