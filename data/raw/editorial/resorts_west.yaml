  id: bear-mountain
  overview_md: "Bear Mountain sits in the city of Big Bear Lake in the San Bernardino National Forest of Southern California, about 2.4 miles east of Snow Summit. It was established in 1941 and has carried the names Moonridge, Goldmine and Big Bear Mountain. It is known for progressive terrain: it opened the first freestyle terrain park in North America, Outlaw, in 1992, and it holds the only halfpipes and the highest lift served peak in Southern California. It is part of Big Bear Mountain Resort within Alterra Mountain Company."
  culture_md: "Bear Mountain is known for a youthful atmosphere and has the largest learning areas in Southern California. Big Bear Lake had 5,046 residents in 2020, yet visitors in the greater Big Bear Valley often top 100,000 on weekends. 75.2 percent of the city's housing units were vacant in 2020. Free Mountain Transit buses run several routes in the valley."
