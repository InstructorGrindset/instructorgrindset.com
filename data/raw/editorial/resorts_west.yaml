  id: crested-butte
  overview_md: "Crested Butte Mountain Resort sits in the town of Mount Crested Butte in Gunnison County, Colorado, next to the historic town of Crested Butte. Fred Rice and Dick Eflin bought a ranch on the mountain in 1960 to start it. Vail Resorts announced its purchase in June 2018 and owns it today. The company lists over 1,500 skiable acres and over 3,000 feet of vertical. Crested Butte hosted the Winter X Games in 1998 and 1999."
  culture_md: "Crested Butte is a former coal mining town in the Slate River Valley. When the mines closed the town shrank, and the ski resort revived its economy around tourism. The town has since become a retreat for the affluent, and the resulting housing crisis has pushed the average home value over $900,000. The town had 1,639 residents in 2020. Festivals include Flauschink in spring and Vinotok in fall. Buses link Crested Butte to Gunnison, a college town of 6,560 and home to Western Colorado University."
