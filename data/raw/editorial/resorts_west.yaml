- target: resort
  id: telluride
  overview_md: "Telluride Ski Resort spans the historic town of Telluride and the newer alpine community of Mountain Village in the San Juan Mountains of southwest Colorado. It has over 2,000 skiable acres. Telluride is known for its advanced terrain, and over half its runs are beginner or intermediate. Joe Zoline founded the ski area, which started in the 1970 to 1971 season. A free gondola links Telluride and Mountain Village. Chuck Horning, a Newport Beach real estate investor, took over ownership in February 2004."
  culture_md: "Telluride is a former silver mining camp in a box canyon, and its historic district is a National Historic Landmark. When the Pandora mine closed in 1978, skiing and tourism became the town's income. Young newcomers the locals called hippies replaced many mining families. Telluride has hosted the Bluegrass Festival and the Film Festival since 1974 and Mountainfilm since 1979. In the 1980s wealthy skiers flocked to the mountain all winter. Telluride had 2,607 residents in 2020 and Mountain Village had 1,264."
  alexandre_take_md: null
  status: reviewed
  reviewed_by: "site owner"
  reviewed_date: 2026-10-13
