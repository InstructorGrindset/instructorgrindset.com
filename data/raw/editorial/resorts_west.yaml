  id: kirkwood
  overview_md: "Kirkwood Mountain Resort sits in the Eldorado National Forest about 33 miles south of South Lake Tahoe, reached by State Route 88. It opened in 1972 after Caltrans began plowing Highway 88 year round in 1971, and for most of its history it ran off the grid on diesel generators. It has 2,300 acres, five peaks, ample off piste terrain and only 12 percent beginner runs. It averages 354 inches of snow, second in the Sierra Nevada to Sugar Bowl. Vail Resorts owns it."
  culture_md: "Kirkwood hosted legs of the North American Freeskiing Championships in 2009 and 2010. The community of Kirkwood had 190 residents in 2020, and only 12.3 percent of its 659 housing units were occupied; 26.8 percent of residents lived in group quarters. In 2026 the resort won the National Ski Areas Association's Golden Eagle Award for sustainability innovation for its on site wood mill."
