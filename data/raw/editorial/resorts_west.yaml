  id: silverton-mountain
  overview_md: "Silverton Mountain sits near the town of Silverton in the San Juan Mountains of southwest Colorado. Aaron and Jen Brill founded it, and it opened on January 19, 2002, with one double chair bought from Mammoth. The single lift serves 1,819 acres of advanced and expert terrain that is ungroomed and unpatrolled, so avalanche gear is required at all times. Silverton is also the base for over 22,000 acres of heli skiing, sold by the drop, and it opens Thursday through Sunday from December through April."
  culture_md: "The ski area is known for adventure, powder and steep terrain, and it runs avalanche courses. Silverton is a former mining town in a National Historic Landmark district, and its last mine closed in 1992. The town now depends mainly on tourism and on government remediation and preservation work. It had 622 residents in 2020. Silverton Mountain's opening in 2002 began year round tourism, and winter events such as skijoring now draw crowds that rival summer."
