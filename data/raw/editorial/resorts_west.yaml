  id: mt-baker
  overview_md: "Mt. Baker Ski Area sits at the end of State Route 542 in Whatcom County, Washington, about 10 miles south of the Canadian border and closer to Mount Shuksan than Mount Baker. It holds the world record for snowfall in one season, 1,140 inches in 1998 to 1999, and averages 641 inches a year. It is known for challenging in bounds routes and lift accessed backcountry. Its first chairlift, Pan Dome, was built in 1953. The season usually runs from late November to late April."
  culture_md: "Mt. Baker has hosted the Legendary Banked Slalom every year since 1985, a snowboard race through a natural halfpipe that draws professionals from around the world and amateurs of all ages. Ski and snowboard films often feature the area. Glacier, the closest community, had 300 residents in 2020 and sits a 20 mile drive from the ski area."
