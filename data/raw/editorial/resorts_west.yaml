  id: jackson-hole
  overview_md: "Jackson Hole Mountain Resort sits in Teton Village, Wyoming, 12 miles northwest of the town of Jackson and due south of Grand Teton National Park. It is known for steep terrain, including Corbet's Couloir, and a continuous vertical drop of 4,139 feet served by its aerial tram. Apres Vous mountain opened in the 1965 to 1966 winter. Jay Kemmerer sold the resort in February 2024 to board members Eric Macy and Mike Corbat. The media often lists it among North America's most expensive ski resorts."
  culture_md: "Jackson, the largest incorporated town in Wyoming, had 10,760 residents in 2020. Tourism drives a strong local economy, with art galleries, custom jewelers and designer clothing stores around the town square. In 2010, arts, recreation, lodging and food services provided 32.2 percent of local jobs. A 2019 Bloomberg report found Teton County had the highest per capita income of any U.S. county, at $252,000. Jackson Hole Airport, 11 miles from Teton Village, has seasonal flights to 20 U.S. cities."
  alexandre_take_md: null
  status: reviewed
