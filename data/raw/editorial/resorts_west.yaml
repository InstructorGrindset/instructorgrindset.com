  id: northstar
  overview_md: "Northstar California sits in Placer County near the northwest shore of Lake Tahoe, about 200 miles from the San Francisco Bay Area. The 3,170 acre resort has 2,280 feet of vertical, 19 lifts, a village with lodging and a cross country center. Vail Resorts has operated it since 2010 under a lease from affiliates of EPR Properties, extended in fiscal 2026 through January 2037. Vail Resorts calls Northstar a luxury resort, with premium lodging and a village of high end shops and restaurants."
  culture_md: "Each ski season thousands of skiers from across Nevada and California, including San Francisco and Sacramento, come to the Tahoe slopes. Its village holds a conference center and a 9,000 square foot skating rink, and summer brings golf and a lift served bike park. Nearby Truckee, a town of 16,729 in 2020 with 50.6 percent of housing units vacant, counts ski racers Daron Rahlves and Travis Ganong among its notable people."
