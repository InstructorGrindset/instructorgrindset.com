  - target: resort
    id: mad-river-glen
    overview_md: "Mad River Glen is a ski area in Fayston, Vermont, in the Mad River Valley. Roland Palmedo founded it in 1947 for dedicated skiers, with a minimum of commercial amenities. A skier cooperative formed in 1995 owns it, and shareholders vote at regular Town Hall meetings. It runs the 1948 Single Chair, one of two single chairlifts left in the country, bans snowboarding, and keeps narrow trails with little grooming. Ski magazine ranked its terrain the most challenging on the East Coast, and it joined the National Register of Historic Places in 2012."
    culture_md: "Mad River Glen keeps a traditional form of New England skiing built on natural snow and trails cut decades ago, often by the skiers themselves. Telemark skiers make up a large share of its skiers. Over 75 percent of cooperative members voted to keep the snowboard ban. Waitsfield, a valley town of 1,844 people (2020 census), has an economy largely supported by Mad River Glen and Sugarbush."
