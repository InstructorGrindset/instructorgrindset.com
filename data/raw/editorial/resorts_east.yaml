    overview_md: "Berkshire East Mountain Resort is a medium sized ski area on Mount Institute in Charlemont and Hawley, Massachusetts, in the Berkshires. It began as Thunder Mountain in the early 1960s. It is known for racing programs that have trained skiers up to the US Ski Team, and it often hosts USSA and MIAA slalom and giant slalom championships. In 2011 a wind turbine made it the first ski area in the world fully powered by onsite renewable energy. Owner Jon Shaefer is CEO of Bear Den Partners, which bought Burke in 2025."
    culture_md: "Charlemont is a town of 1,185 people (2020 census) on the Mohawk Trail and the Deerfield River, where whitewater rafting is popular. Berkshire East is the only public alpine ski area in Franklin County. In summer the resort runs zip lines, the Thunderbolt mountain coaster and a downhill bike park. Its season passes include skiing at Burke Mountain in Vermont."
