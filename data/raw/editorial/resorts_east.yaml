  - target: resort
    id: jay-peak
    overview_md: "Jay Peak Resort sits in the northern Green Mountains between Jay and Montgomery Center, Vermont, about 4 miles south of the Quebec border. It receives the most snowfall of any ski area in the Northeastern U.S. and is known for its gladed skiing and the steep Face Chutes. EB 5 financed development added hotels, an ice arena and a water park before federal officials seized the resort in 2016 in a securities fraud case. Pacific Group Resorts of Park City, Utah, bought it at a court supervised auction for $76 million in 2022."
    culture_md: "Jay is a border town of 551 people (2020 census) in Orleans County. The resort is a major local employer: it was the second biggest employer in the area in 2008, and as of 2022 it employed more than 1,200 people in winter and about half that number year round. It reported a record 320,000 skiers in the 2007 to 2008 winter."
