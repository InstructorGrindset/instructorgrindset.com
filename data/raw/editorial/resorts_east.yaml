  - target: resort
    id: okemo
    overview_md: "Okemo Mountain Resort is in the town of Ludlow in southern Vermont. Its 2,200 foot vertical drop is the largest in southern Vermont, and snowmaking covers 98 percent of its trail area. Local businessmen founded it in 1955. Tim and Dianne Mueller bought it in 1982 and expanded it for decades, and Vail Resorts acquired it in 2018. Parents Magazine rated it the top US family snow resort. Vail describes Okemo as a regional destination for guests from the New York metropolitan area and throughout New England."
    culture_md: "Ludlow is a town of 2,172 people (2020 census). It was a mill town and home to a General Electric plant until 1977 before it became a ski destination. The town was among the places hit hardest by the July 2023 Vermont floods. Visitor's Choice on the Snow rated Okemo's beginner terrain number one in Vermont, and SKI Magazine readers ranked its grooming sixth in the nation."
