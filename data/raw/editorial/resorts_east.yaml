  - target: resort
    id: cranmore
    overview_md: "Cranmore Mountain Resort is a ski area in North Conway, New Hampshire, that opened for the 1937 to 1938 season. Austrian ski pioneer Hannes Schneider moved there in 1939 and drove its expansion, and its early ski school run by European skiers set it apart. It was one of the first ski areas to develop trail grooming technology. Brian Fairbank, Tyler Fairbank and Joseph O'Donnell, operators of Jiminy Peak, bought it in 2010. All its terrain has snowmaking, and a Mountain Adventure Park runs in summer."
    culture_md: "North Conway, a village of 2,116 people (2020 census) in the town of Conway, is known as the birthplace of American skiing, and snow trains began bringing skiers there in 1932. In winter the village is the nighttime destination for skiers from Cranmore, Attitash, Black Mountain and Wildcat. Tourism is Conway's biggest economic engine, and North Conway is a major outlet shopping destination."
