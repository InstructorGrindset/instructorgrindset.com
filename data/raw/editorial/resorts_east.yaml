    overview_md: "Seven Springs Mountain Resort is a four season resort in the borough of Seven Springs, Pennsylvania, at 2,994 feet, a high elevation for a Pennsylvania ski area. Bavarian immigrants Adolph and Helen Dupre founded Seven Springs farm in 1932 and installed a rope tow for local skiers. Vail Resorts bought Seven Springs, Hidden Valley and Laurel Mountain in December 2021 for about $118 million. Vail says the three sit near Pittsburgh and draw drive to business from Washington DC, Baltimore and Cleveland."
    culture_md: "The borough had 26 residents in 2020 and spans Somerset and Fayette counties; the Fayette portion belongs to the Pittsburgh metropolitan area, and the resort's mailing address is the village of Champion. The resort hosts events through the year, including Brewski Fest, Autumnfest, a Wine Festival and a Pond Skim. Transworld Snowboarding named its halfpipe the East Coast's best in 2009 and 2010."
