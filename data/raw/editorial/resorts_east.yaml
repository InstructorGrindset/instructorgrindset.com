    id: waterville-valley
    overview_md: "Waterville Valley Resort is on Mount Tecumseh inside the planned resort community of Waterville Valley, New Hampshire, about 130 miles north of Boston off Interstate 93. A group led by Tom Corcoran opened it in 1966. It hosted World Cup alpine races from 1969 through most of the 1980s, and in 2024 it held the first dual moguls World Cup on American soil. Members of the Sununu family and area investors bought it in 2010, and it remains independent. Snowmaking covers about 100 percent of its terrain."
    culture_md: "Waterville Valley is a resort town of 508 people (2020 census) that draws winter visitors for alpine and cross country skiing. The Black and Blue Trail Smashers, founded in 1934, is one of the oldest ski clubs in the country and the home club of 2010 Olympic moguls champion Hannah Kearney. Waterville Valley Academy, founded in 1972, has around 160 students. The resort built New Hampshire's first terrain park."
