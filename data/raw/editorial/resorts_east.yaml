  - target: resort
    id: hermitage-club
    overview_md: "The Hermitage Club is a private, member owned ski club on Haystack Mountain in Wilmington, Vermont. Haystack opened to the public in 1964 and ran as a public ski area until 2005. Jim Barnes opened the club for the 2012 to 2013 season and built an 80,000 square foot clubhouse, and the club went into bankruptcy in 2018. In March 2020, 181 former members bought it at auction for $8.06 million and formed the nonprofit Hermitage Members Group, which runs it with a volunteer board."
    culture_md: "Members use a clubhouse with a bar, restaurant, bowling alley, movie theatre, spa, gym and ski lockers. The owner group describes the club as a private, four season, family friendly ski resort. Wilmington is a town of 2,255 people (2020 census). In 1968 Haystack was among the first ski areas to teach blind skiers, and its instructors skied the mountain blindfolded to prepare."
