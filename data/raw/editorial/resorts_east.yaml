  - target: resort
    id: hunter-mountain
    overview_md: "Hunter Mountain is a ski resort in the town of Hunter, Greene County, about three hours northwest of New York City in the Catskills. Local businessmen opened it in 1960 to revive an economy hurt by the decline of Catskills tourism. Hunter was the first area in the world with summit to base snowmaking and, in 1980, the first with snowmaking on 100 percent of its trails. Peak Resorts bought it from the founding Slutzky family in 2015, and Vail Resorts acquired Peak in 2019. Vail calls it a day trip ski area primarily serving the New York metropolitan area."
    culture_md: "Hunter is a town of 3,035 people (2020 census) with two villages, Hunter and Tannersville. The ski resort is the largest employer in the village of Hunter, and the seasonal nature of the mountain regulates the town's economic activity. The area was a popular tourism destination in the late nineteenth and early twentieth centuries. The first Hunter summer festival, a ten day German Alps Festival, ran in July 1975."
