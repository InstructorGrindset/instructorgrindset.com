  - target: resort
    id: whiteface
    overview_md: "Whiteface ski area sits on the east slope of Whiteface Mountain in the town of Wilmington, New York, among the Adirondack High Peaks. It opened in 1960 and is run by the Olympic Regional Development Authority. Whiteface hosted all six alpine events of the 1980 Winter Olympics and alpine skiing at the 2023 Winter World University Games. Its hike to terrain, The Slides, gives it the greatest continuous vertical drop in eastern North America at 3,430 feet. Lake Placid, host of the 1932 and 1980 Winter Olympics, lies nearby."
    culture_md: "Wilmington is a town of 1,139 people (2020) inside the Adirondack Park, and its hamlet is a resort and skiing center. Tourism grew there early in the twentieth century, and Santa's Workshop, one of the first American theme parks for children, sits on the Whiteface highway. Lake Placid, a village of 2,205 people (2020 census), became internationally known for the 1932 and 1980 Winter Olympics."
