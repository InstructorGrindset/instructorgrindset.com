  - target: resort
    id: wildcat
    overview_md: "Wildcat Mountain is a ski area in Pinkham Notch near Jackson, New Hampshire, with a view of Mount Washington. Its 2,112 foot vertical drop is the second largest in New Hampshire, and its Polecat trail is the longest in the state. Wildcat opened the first gondola in North America in 1958, and the Civilian Conservation Corps cut its original racing trail in 1933. More than 200 inches of snow a year usually keep it open from mid November to early May. Vail Resorts bought it with Attitash in 2019."
    culture_md: "Jackson is a town of 1,028 people (2020 census) and a resort area in the White Mountains, where painters arrived from 1847 and grand hotels followed the railroad. It is known for Jackson Falls and its 100 kilometer cross country ski trail system. The ungroomed Wildcat Valley Trail runs from Wildcat's summit down to the village. In winter, skiers from the valley resorts spend their evenings in North Conway."
