  - target: resort
    id: burke
    overview_md: "Burke Mountain Ski Area is a mid size resort in Vermont's Northeast Kingdom, in the town of Burke near the village of East Burke. It is home to Burke Mountain Academy, founded in 1970 as the first ski academy in North America, whose alumni include Mikaela Shiffrin. The owners of Jay Peak bought Burke in 2012, and it entered federal receivership in 2016 in the EB 5 fraud case. Bear Den Partners bought it in April 2025 for a reported $11.5 million and announced plans to invest up to $20 million in snowmaking, lifts and terrain."
    culture_md: "Burke is a town of 1,651 people (2020 census) that includes the villages of East Burke, West Burke and Burke Hollow. East Burke is home to the Kingdom Trails system, where hundreds of mountain bikers ride at a time in summer and autumn. The resort hotel is a popular place for weddings and events. Burke Mountain Academy, a full year school, trains alpine racers on the mountain."
