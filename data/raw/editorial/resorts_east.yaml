  - target: resort
    id: mount-snow
    overview_md: "Mount Snow is Vermont's southernmost big mountain and the closest to many Northeast metropolitan areas. It sits in the town of Dover, with the village of West Dover as a major service point. Walt Schoenknecht opened it in 1954. Mount Snow opened the first snowboard park in the East in 1992, cohosted the first Extreme Games in 1995 and hosted the X Games in 2000 and 2001. Carinthia Parks holds ten terrain parks. Vail Resorts bought it with Peak Resorts in 2019."
    culture_md: "Dover is a town of 1,798 people (2020 census) known as the home of Mount Snow, and West Dover is a major service point for the ski area. Mount Snow Academy graduates include 2002 Olympic halfpipe gold medalist Kelly Clark and 2014 Olympic slopestyle silver medalist Devin Logan. Vail describes Mount Snow as a regional destination for guests from the New York metropolitan area and throughout New England."
