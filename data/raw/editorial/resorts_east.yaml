    id: black-mountain-maine
    overview_md: "Black Mountain of Maine is a ski area in Rumford best known for its Nordic skiing. Rumford's Chisholm Ski Club opened it in 1962, and its cross country trails, designed by Rumford native and two time Olympian Chummy Broomhall, have hosted US cross country national championships in 1993, 1999, 2003 and 2004. The Maine Winter Sports Center bought it in 2003 and added two chairlifts, raising the vertical drop to 1,150 feet. It joined the Indy Pass in 2022."
    culture_md: "Rumford is a mill town of 5,858 people (2020 census) that has made paper since 1893 and is home to ND Paper's Rumford Mill. Skiing has a long history in town: residents housed the competitors when Rumford held the cross country events of the 1950 FIS Nordic World Ski Championships, and two Rumford skiers made the 1952 Olympic team. Longtime local skiers called the 2005 opening of the summit chair one of the most exciting days of their lives."
