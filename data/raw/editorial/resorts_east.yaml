  - target: resort
    id: sugarloaf
    overview_md: "Sugarloaf is a ski resort on Sugarloaf Mountain in Carrabassett Valley, western Maine. It is the second largest ski resort east of the Mississippi by skiable area, has the highest peak elevation of any New England ski resort, and offers the only lift served skiing above treeline in the Northeast. The Sugarloaf Mountain Ski Club cut the first trail in 1950. Boyne Resorts has managed Sugarloaf since 2007 and bought the resort in March 2018. Carrabassett Valley Academy, at the base, counts 12 Olympians among its alumni."
    culture_md: "Carrabassett Valley is a town of 673 people (2020 census) that incorporated in 1971 and played a large role in Sugarloaf's development. Kingfield, population 960, is the principal gateway to the resort and home of the Ski Museum of Maine. Most trails carry logging terms as a tribute to Maine's logging history. Carrabassett Valley Academy draws students from Japan, Korea, Europe, Australia, New Zealand and South Africa."
