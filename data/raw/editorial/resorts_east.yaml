entries:
  - target: resort
    id: stowe
    overview_md: "Stowe Mountain Resort covers two mountains, Mount Mansfield and Spruce Peak, near the town of Stowe in northern Vermont. Mount Mansfield is the highest peak in the state. The Civilian Conservation Corps cut the first trails there in 1933, and the Mount Mansfield Ski Patrol, founded in 1934, is the oldest in the nation and the model for the National Ski Patrol. AIG sold the ski operations to Vail Resorts in 2017. Vail's annual report calls Stowe its premier high end regional ski area in the Northeast. Stowe sits in the Northern Vermont cluster with Jay Peak and Burke."
    culture_md: "Stowe is a town of 5,223 people (2020 census) nicknamed the Ski Capital of the East. It was a known summer resort by the middle of the nineteenth century and held its first Winter Carnival in 1921. The Vermont Ski Museum moved to Stowe in 2000, and the Mount Mansfield Winter Academy in town focuses on snow sport athletes. Vail says its Northeast ski areas serve guests within driving distance of New York, Boston and greater New England."
    alexandre_take_md: null
    status: reviewed
    reviewed_by: "site owner"
    reviewed_date: 2026-10-13
    source_ids: [ed-east-wikipedia-stowe-mountain-resort, ed-east-wikipedia-stowe-vermont, ed-east-vail-10k-fy2026]
  - target: resort
    id: killington
    overview_md: "Killington is the largest ski area in the eastern U.S. and has the largest vertical drop in New England. It spreads across six interconnected peaks near the town of Killington in Rutland County, and its nickname is the Beast of the East. Snowmaking on Superstar and other trails often gives it the longest season in eastern North America, and since 2016 it has hosted women's World Cup races each Thanksgiving weekend. In September 2024 the Killington Independence Group, formed by local passholders and community members, bought Killington and Pico from Powdr."
    culture_md: "Killington is a town of 1,407 people (2020 census) built around the ski resort and its many vacation lodges. It was named Sherburne until 1999. The resort's mountains separate the town from the city of Rutland. Bear Mountain holds the Bear Mountain Mogul Challenge on Outer Limits and hosts large racing and freestyle events. Most Killington passes also work at Pico, its sister mountain a few miles away."
    alexandre_take_md: null
    status: reviewed
    reviewed_by: "site owner"
    reviewed_date: 2026-10-13
    source_ids: [ed-east-wikipedia-killington-ski-resort, ed-east-wikipedia-killington-vermont, ed-east-wikipedia-pico-mountain]
  - target: resort
    id: pico
    overview_md: "Pico Mountain sits on Pico Peak along U.S. Route 4 in Killington, several miles from the main Killington resort. It opened on Thanksgiving Day 1937 as one of the first commercial ski resorts in Vermont, and in 1940 it ran the first T bar lift in the US. The Mead family founded it; their daughter Andrea Mead Lawrence won two Olympic gold medals in 1952. Killington bought Pico out of receivership in the 1990s, and the Killington Independence Group bought both from Powdr in 2024."
    culture_md: "Pico shares the town of Killington, population 1,407 at the 2020 census, with its larger neighbor. Trails off the Golden Express cater mainly to families and beginner and intermediate riders, while the summit runs are mostly steep black diamonds for experts. Hotels, condos and restaurants sit at the base, and the base lodge holds a Vermont Ski and Snowboard Museum exhibit."
    alexandre_take_md: null
    status: reviewed
    reviewed_by: "site owner"
    reviewed_date: 2026-10-13
    source_ids: [ed-east-wikipedia-pico-mountain, ed-east-wikipedia-killington-ski-resort, ed-east-wikipedia-killington-vermont]
  - target: resort
    id: sugarbush
    overview_md: "Sugarbush Resort sits in the Mad River Valley in Warren, Vermont, and is one of the largest ski resorts in New England. It has two mountain areas, Lincoln Peak and Mount Ellen, joined by the Slide Brook Express chairlift over the expert Slide Brook Basin. Its 2,600 foot vertical drop is the second largest in Vermont after Killington. Damon and Sara Gadd and Jack Murphy opened it on Christmas Day 1958. Alterra Mountain Company bought Sugarbush in November 2019. It shares the valley with Mad River Glen in the Central Vermont cluster."
    culture_md: "The Mad River Valley towns of Warren (1,977 people in 2020), Waitsfield (1,844) and Fayston (1,364) surround the resort. Waitsfield's economy is largely supported by Sugarbush and Mad River Glen, along with its restaurants and lodging. Green Mountain Valley School trains racers on the Inverness slopes at Mount Ellen. Lincoln Peak Village, finished in 2010, added the Claybrook luxury condominiums and a Schoolhouse for children's programs."
