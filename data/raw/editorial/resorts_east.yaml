  - target: resort
    id: lake-placid-olympic-jumping-complex
    overview_md: "The Lake Placid Olympic Ski Jumping Complex, also called the MacKenzie Intervale complex, has HS100 and HS128 jump towers built for the 1980 Winter Olympics. Modernized and lengthened in 2021, they are the only jumps in North America homologated for winter and summer competition. The Olympic Regional Development Authority operates the site. Jumpers train year round on a plastic mat out run, and aerialists at the Freestyle Aerial Training Center train in summer by jumping into a 750,000 gallon pool. In 2023 it hosted the first men's super team World Cup."
    culture_md: "Lake Placid is a village of 2,205 people (2020 census) in the Adirondacks that became internationally known for the 1932 and 1980 Winter Olympics, and it also hosted the 1972 and 2023 Winter World University Games. Winter sport there grew from the Lake Placid Club, which stayed open through the winter of 1905. The club built the first jump on this site in 1920."
