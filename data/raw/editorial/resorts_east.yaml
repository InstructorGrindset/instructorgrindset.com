  - target: resort
    id: saskadena-six
    overview_md: "Saskadena Six, called Suicide Six until 2022, is a ski area in South Pomfret, Vermont, near Woodstock. It traces to the first rope tow in the United States, installed on a farm in January 1934. Laurance Rockefeller bought it in 1961 and developed it with his nearby Woodstock Inn, and as of 2011 it operated as the inn's ski area. It hosted the first National Snow Surfing Championships in 1982, a forerunner of the U.S. Open Snowboarding Championships. The new name means standing mountain in the Abenaki language."
    culture_md: "The Boston Globe described the area in 2004 as a low key place for a taste of rural skiing. It hosts the Fisk Trophy Race, first held in 1937 and the longest running ski race in North America, a rite of passage for serious eastern racers. Woodstock, the Windsor County seat with 3,005 people in 2020, draws visitors to the Billings Farm and Museum and its historic village."
