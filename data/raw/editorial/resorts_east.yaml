    overview_md: "Laurel Mountain is a ski area in Laurel Mountain State Park, Westmoreland County, Pennsylvania. The Commonwealth of Pennsylvania owns it, and Vail Resorts has operated it under lease since December 2021. Austrian ski pioneer Hannes Schneider designed the slopes, and it opened in 1940 as an exclusive club before it was gifted to the state in 1964. It closed in 2005 and reopened for the 2016 to 2017 season after a $6.5 million renovation. It has 20 trails and a 761 foot vertical drop."
    culture_md: "Laurel Mountain began as a club for prominent Pennsylvanians. The Pittsburgh Ski Club used its 1940 Midway Cabin as its mountain headquarters until about 1954, when regional skiing shifted toward Seven Springs and Hidden Valley. The cabin still stands halfway down the Broadway slope, and the modern lodge displays historic Pennsylvania ski memorabilia."
