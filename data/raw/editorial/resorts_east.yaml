    overview_md: "Snowshoe Mountain is a ski resort on Cheat Mountain in Pocahontas County, West Virginia, in the Allegheny Mountains. Its village sits near the summit. It includes the Snowshoe and Silver Creek areas, and Cupp Run and Shay's Revenge drop 1,500 vertical feet, the most in the Southeast and Mid Atlantic. Thomas Brigham, a dentist from North Carolina, opened it in 1974. Intrawest bought it in 1995, and Alterra Mountain Company acquired Intrawest in 2017. Its bike park is a regular UCI Mountain Bike World Cup stop."
    culture_md: "About 480,000 skiers visit each year, mostly from larger Mid Atlantic and Southeast cities and from across West Virginia. Pocahontas County has 7,869 people (2020 census), and tourism is one of its largest industries; about 30,000 people from outside the county owned property there as of 2008. Most of the resort's 1,400 condo and lodge units are privately owned and managed by the resort. Trail names recall the area's logging history."
