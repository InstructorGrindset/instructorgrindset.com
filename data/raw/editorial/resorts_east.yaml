    overview_md: "Cannon Mountain is a state owned ski area in Franconia Notch State Park in New Hampshire's White Mountains. It has the largest vertical drop in New Hampshire at 2,180 feet and the only aerial tram in the state. Cannon was the site of North America's first passenger aerial tramway in 1938, and its Richard Taft Race Course dates to 1931 and 1932. Olympic skier Bode Miller grew up skiing here. In 2013 SKI Magazine named it number one in New Hampshire for value, challenge and overall satisfaction."
    culture_md: "Franconia is a town of 1,083 people (2020 census) in the White Mountains and home to the northern half of Franconia Notch State Park and the New England Ski Museum. The state tramway helped prove skiing as an industry in New Hampshire and drew private investment into the state's ski business. Cannon runs a PSIA ski and snowboard school and youth programs at its Brookside Learning Center."
