    id: gunstock
    overview_md: "Gunstock Mountain Resort is a recreation area owned by Belknap County on Gunstock Mountain in Gilford, New Hampshire. Works Progress Administration crews built it, and it was completed in 1937 with the first chairlift in the eastern United States. Most trails carry gun names such as Pistol and Musket. A county commission oversees the resort; in July 2022 the management team resigned over the commission's role, and the resort closed for 13 days until they returned. It offers night skiing on its lower slopes."
    culture_md: "Gilford is a town of 7,699 people (2020 census) on Lake Winnipesaukee. It was the destination of the first snow train from Boston in the 1930s and had New Hampshire's first motorized ski lift, a rope tow built in 1934. Building the resort during the Depression transformed the region's economy. Gunstock holds an annual glowstick themed night terrain park contest called Glow and Throw."
