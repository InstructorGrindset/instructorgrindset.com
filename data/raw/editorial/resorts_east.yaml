  - target: resort
    id: magic-mountain
    overview_md: "Magic Mountain is a ski area on Glebe Mountain in Londonderry, Vermont, with a 1,500 foot vertical drop. Ski instructor and filmmaker Hans Thorner founded it in 1960 because its terrain reminded him of his native Swiss Alps. It was part of Vermont's original Golden Triangle with Stratton and Bromley. After a closure through much of the 1990s it reopened in 1997. SKI MAGIC LLC, a group led by local Magic skier Geoff Hatheway, bought it in 2016. It has the most extensive glade network in southern Vermont."
    culture_md: "After reopening, Magic regained a small but passionate following among ski enthusiasts for its classic, challenging terrain. Pitches reach 45 degrees at the top of Master Magician. Londonderry is a town of 1,919 people (2020 census) with the villages of Londonderry and South Londonderry. The new owners invested over $2 million in snowmaking, lifts, the bar and the lodge after the 2016 purchase."
