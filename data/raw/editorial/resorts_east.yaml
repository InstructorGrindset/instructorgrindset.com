    overview_md: "Attitash Mountain Resort is on U.S. Route 302 in Bartlett, New Hampshire, near North Conway. It has two peaks with 68 runs: Attitash keeps narrow, old New England style trails, and Bear Peak has wider trails and more glades. It operates under a special use permit with the White Mountain National Forest. Vail Resorts bought it from Peak Resorts in 2019, and tickets work at its sister resort Wildcat. Vail says its four New Hampshire ski areas serve guests throughout New England."
    culture_md: "Bartlett is a town of 3,200 people (2020 census) surrounded by the White Mountain National Forest, where tourism has long been a principal business. It is also home to the Story Land theme park and the Bear Notch Ski Touring center. Neighboring Conway is the commercial hub of Carroll County, with tourism as its largest economic engine and Memorial Hospital as its largest employer as of 2002."
