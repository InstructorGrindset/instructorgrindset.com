    overview_md: "Crotched Mountain is a medium sized ski area in Bennington and Francestown, New Hampshire, about 77 miles northwest of Boston and 26 miles west of Manchester. The original area closed in 1989 under condominium debt. Peak Resorts bought it in 2002 and reopened it in 2003 after a 13 year closure, and Vail Resorts bought Peak Resorts in 2019. Crotched is a popular destination for night skiing, with sessions until midnight on several nights each winter."
    culture_md: "Bennington is a town of 1,501 people (2020 census) and home to Monadnock Paper Mills. Crotched sits 30 miles east of Keene. The original Crotched Mountain area opened in 1964 on the northeast face, and the town of Francestown now owns most of that land. Vail says its four New Hampshire ski areas serve guests throughout New England."
