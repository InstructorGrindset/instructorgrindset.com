  - target: resort
    id: stratton
    overview_md: "Stratton Mountain Resort is on Stratton Mountain in Stratton, Vermont, east of Manchester. It opened in December 1961. In the 1980s it became the first ski area to allow snowboarding and home to the first snowboard school, and it hosted the Burton U.S. Open Snowboarding Championships from 1985 to 2012. Stratton Mountain School, founded at the mountain in 1972, has produced 46 Olympic athletes. Alterra Mountain Company has owned Stratton since 2017, when it was formed through the purchase of Intrawest."
    culture_md: "In the 1960s a group of Austrian ski instructors, the Stratton Mountain Boys, started European style après ski at Stratton and became part of its marketing. Intrawest later built premium real estate at the base, including the Village Common and ski in, ski out homes. The resort community of Stratton Mountain spans the towns of Stratton (440 people in 2020) and Winhall (1,182). Stratton Mountain School tuition for 2023 to 2024 was $65,500 for boarders."
