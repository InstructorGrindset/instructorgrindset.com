    overview_md: "Mount Sunapee Resort is a ski area inside Mount Sunapee State Park in Newbury, New Hampshire. The state built its first chairlift after World War II and ran the area until 1998, when the Mueller family of Okemo began leasing it. Vail Resorts acquired it with Okemo and Crested Butte in 2018 and leases its land from the State of New Hampshire. Snowmaking covers 97 percent of its 230 acres. Vail says its four New Hampshire ski areas serve guests throughout New England."
    culture_md: "Newbury is a town of 2,172 people (2020 census) at the south end of Lake Sunapee. The resort holds the Slush Cup each spring, where skiers and riders try to cross a man made pond, and every August it hosts the League of New Hampshire Craftsmen's Fair, held since 1934. The state park beach on Lake Sunapee sits at the park entrance."
