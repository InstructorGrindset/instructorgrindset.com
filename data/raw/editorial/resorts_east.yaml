  - target: resort
    id: sunday-river
    overview_md: "Sunday River is a ski resort in Newry, Maine, and one of the state's largest and most visited. It has 139 trails across eight interconnected peaks, and its 2,340 foot vertical drop is the second largest in Maine after Sugarloaf. Boyne Resorts has operated it since American Skiing Company sold it with Sugarloaf in 2007, and Boyne bought its leased New England areas in 2018. Gould Academy athletes from nearby Bethel spend winter mornings training at Sunday River. It hosted the NCAA skiing championships in 1976, 1999 and 2009."
    culture_md: "Newry is a resort town of 411 year round residents (2020 census) with a proportionately large winter population. Bethel, population 2,504, was a fashionable summer resort between the Civil War and World War I and is home to Gould Academy. Local traditions include Santa Sunday, a charity ski in Santa suits held since 2000, and the Bust 'N' Burn mogul contest, revived in 2024."
