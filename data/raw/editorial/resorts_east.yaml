  - target: resort
    id: middlebury-snow-bowl
    overview_md: "The Middlebury College Snow Bowl is a ski area in Hancock, Vermont, 13 miles east of Middlebury near Middlebury Gap. Middlebury College has owned and run it since its first trails were cut in 1934. It has hosted intercollegiate competitions since the 1930s, and its 1938 log cabin lodge is the oldest standing base lodge in the nation. In 2006 it became the first carbon neutral ski area in the United States. It averages 200 inches of natural snow a year."
    culture_md: "Hancock is a town of 359 people (2020 census) on the White River and Vermont Route 100, and it contains Middlebury Gap. The college runs the Snow Bowl as part of its sustainability commitment, with efficient snow guns, an electric compressor and plans for electric snowmobiles and cars. The eastern face, called the backside, relies mainly on natural snow."
