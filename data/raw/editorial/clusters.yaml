  - target: cluster
    id: i70-corridor
    overview_md: "This cluster covers the resorts along Interstate 70 west of Denver, plus Eldora and Winter Park just off the corridor. Summit County holds Breckenridge, Keystone, Copper Mountain and Arapahoe Basin. It had 31,055 residents in 2020, and 58.7% of its 31,342 housing units were vacant. Breckenridge, the county seat, had 5,078 residents and many part time residents with vacation homes. In Silverthorne, Zillow put the average home price at $846,979 in October 2025. Eagle County, home to Vail and Beaver Creek, had 55,731 residents in 2020. Vail's economy relies heavily on tourism. Its median house price is over $1 million, and the town faces a worker shortage tied to a lack of housing. In 2022 a Vail Resorts spokesperson put the county's workforce shortfall at about 6,000 beds. Loveland, one of the closest areas to the Denver metro area, is popular with locals. Eldora caters mostly to day skiers and is reached by an RTD bus from Boulder. Winter Park sits about ninety minutes from Denver and is served by the Winter Park Express ski train."
