  - target: cluster
    id: southern-vermont
    overview_md: "This cluster sits in the southern Green Mountains. Mount Snow, in the Windham County town of Dover, is the southernmost big mountain in Vermont and so the closest to many Northeast metropolitan areas. Dover had 1,798 residents at the 2020 census and is best known as the home of the ski area. Haystack Mountain shares a ridgeline with Mount Snow in neighboring Wilmington. Stratton Mountain Resort sits east of Manchester in Stratton, a town of 440 people in 2020 whose industry is tourism. Stratton was the first ski area to allow snowboarding, opened the first snowboard school and began hosting the US Open snowboard races in 1985. Bromley, in Peru east of Manchester, is called the Sun Mountain for its southern exposure. Magic Mountain in Londonderry formed Vermont's original Golden Triangle of ski areas with Stratton and Bromley. Manchester, one of the two shire towns of Bennington County, had 4,484 residents in 2020. Windham County had 45,905 residents in 2020, and 31.8% of its housing units were vacant. Bennington County had 37,347, with 24.6% of homes vacant."
