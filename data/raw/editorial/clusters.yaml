  - target: cluster
    id: central-oregon
    overview_md: "Bend anchors this cluster. It is the most populous city in Central Oregon, with 99,178 residents at the 2020 census, and the seat of Deschutes County, which had 198,253. Bend began as a logging town and grew into a center of tourism and recreation. Tourism is one of its largest sectors, and Mt. Bachelor, west of town on Century Drive, brings in visitors from across Oregon, Washington and California. In 2011, tourism employed 16% of the city's workforce. Destination resorts such as Sunriver and Eagle Crest are major employers in the county. Bend is also a retirement destination and a commuter town for some tech workers from the San Francisco Bay Area and Seattle, drawn by the outdoors and a cost of living below those metros. The city has a growing art scene, breweries and the BendFilm Festival, launched in 2004. Mt. Bachelor runs one of the longest seasons in the nation, from mid November through May. Hoodoo sits near Santiam Pass on US Route 20, and Willamette Pass sits on Highway 58 between Oakridge and La Pine."
