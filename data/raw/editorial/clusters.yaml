  - target: cluster
    id: northern-new-mexico
    overview_md: "This cluster sits in the Sangre de Cristo Mountains of north central New Mexico. Taos, the seat of Taos County, had an estimated 6,567 residents in 2021. It sits beside Taos Pueblo, a UNESCO World Heritage Site lived in for roughly a millennium. Taos has three art museums, with work from the Taos art colony, and more than 80 galleries. In winter many people come to ski at the four nearby areas: Taos Ski Valley, Red River, Sipapu and Angel Fire. Taos Ski Valley, a village of 77 people in 2020, sits 30 minutes up the canyon, and the town of Taos provides its year round services. Tourism is the village's main industry, and the ski company employed about 700 people in winter as of the 2011 to 2012 season. Red River, a resort town of 542, runs mainly on tourism and offers a free town bus. Angel Fire, a village of 1,192 in Colfax County, is home to Angel Fire Resort, open since 1966. Taos County had 34,489 residents in 2020, and 50.5% of them were Hispanic or Latino."
