  - target: cluster
    id: mount-hood
    overview_md: "Mount Hood rises east of Portland on the line between Clackamas and Hood River counties. Government Camp, on US Route 26 at the base of the mountain, is the only town nearby and serves as the de facto ski town. It had 179 residents at the 2020 census and is the gateway to Timberline and Mt. Hood Skibowl. Timberline Lodge, a National Historic Landmark built by the Works Progress Administration from 1936 to 1938, draws two million visitors a year. Its ski area sits about 60 miles east of Portland and is open all 12 months, with a two week maintenance closure each September. Summer weekdays are busy with ski and snowboard camps on the Palmer Glacier. Mt. Hood Meadows, the largest area on the mountain, sits about 67 miles east of Portland and 35 miles from Hood River on Oregon Route 35. Hood River, a city of 8,313 in 2020, built its economy on agriculture, tourism and sports recreation. Since the late 1990s, high tech firms such as aerospace companies have become some of its largest employers."
    culture_md: null
