entries:
  - target: cluster
    id: adirondacks
    overview_md: "The Adirondack cluster spreads across the Adirondack Mountains of northern New York. Lake Placid, a village of 2,205 people at the 2020 census, became known internationally as host of the 1932 and 1980 Winter Olympics and hosted the 2023 Winter World University Games. In 2020, 40.7% of its 2,064 housing units were vacant. Whiteface Mountain sits in nearby Wilmington, about 13 miles from Lake Placid, and hosted every alpine event of the 1980 Games. Gore Mountain is in the hamlet of North Creek, population 562 in 2020, about one hour from the Albany metro area, and it draws skiers from across the East. New York State owns both mountains, and the Olympic Regional Development Authority, a state agency, runs them. Growth at Gore brought new private businesses, a community center, an art gallery and a theater company to North Creek. Titus Mountain sits south of Malone in Franklin County."
    culture_md: null
    alexandre_take_md: null
    status: draft
    source_ids: [ed-clusters-wikipedia-lake-placid-new-york, ed-clusters-wikipedia-whiteface-mountain, ed-clusters-wikipedia-gore-mountain-ski-resort, ed-clusters-wikipedia-north-creek-new-york, ed-clusters-wikipedia-titus-mountain]
  - target: cluster
    id: alaska
    overview_md: "This cluster centers on Anchorage, the most populous city in Alaska with 291,247 people at the 2020 census. Girdwood, a resort town inside the Municipality of Anchorage, had an estimated 1,742 residents in 2019. Alyeska Resort, the largest ski area in the state, sits there about 30 miles from downtown. Skiing and snowboarding at Alyeska bring visitors and their money into the valley. Seasonal vacation homes long dominated the town, and the Alyeska Prince Hotel, opened in the 1990s, shifted Girdwood toward a year round economy. Housing affordability for resort workers is a recurring local debate, and many workers have camped illegally on public lands. Summer brings hiking, fishing, rafting and the July Girdwood Forest Fair. Inside Anchorage, Arctic Valley is a nonprofit area run by the Anchorage Ski Club and open mainly on weekends, and Hilltop Ski Area serves the city too. Anchorage's economy rests on transportation, the military, government, tourism, corporate headquarters and resource extraction."
    culture_md: null
    alexandre_take_md: null
    status: draft
    source_ids: [ed-clusters-wikipedia-anchorage-alaska, ed-clusters-wikipedia-girdwood-anchorage-alaska, ed-clusters-wikipedia-alyeska-resort, ed-clusters-wikipedia-arctic-valley-ski-area]
  - target: cluster
    id: appalachia
    overview_md: "This cluster pairs two resort communities in the Allegheny Mountains. Snowshoe Mountain sits in Snowshoe, an unincorporated community in Pocahontas County, West Virginia, built around the resort. Its village sits near the summit. About 480,000 skiers visit each year, mainly from West Virginia and the larger cities of the Mid Atlantic and Southeast. Tourism is one of the county's largest industries, and Snowshoe is its main attraction in summer and winter. The county had 7,869 residents in 2020, and 49.1% of its 6,795 housing units were vacant. About 30,000 people from outside the county owned property there as of 2008. The Homestead ski area in Hot Springs, Virginia, opened in 1959 and is the oldest ski resort in the state. It belongs to The Omni Homestead, a historic resort and the major employer of Bath County, whose economy focuses on tourism and recreation. Bath County had 4,209 residents in 2020."
    culture_md: null
    alexandre_take_md: null
    status: draft
    source_ids: [ed-clusters-wikipedia-snowshoe-mountain, ed-clusters-wikipedia-snowshoe-west-virginia, ed-clusters-wikipedia-pocahontas-county-west-virginia, ed-clusters-wikipedia-the-omni-homestead-resort, ed-clusters-wikipedia-bath-county-virginia]
  - target: cluster
    id: cascades
    overview_md: "This cluster follows the Cascade Range across Washington, and most of its mountains serve the Seattle metro area. The Summit at Snoqualmie sits on Interstate 90 about an hour from Seattle. It is the closest ski area to the city and is often crowded on weekends. Snoqualmie Pass had 372 residents in 2020. Its chalets and condominiums are mainly occupied seasonally by Seattle area residents, and about 300 people live there year round. Crystal Mountain, the largest ski resort in Washington, is primarily a day use area reached from Seattle and Tacoma by State Route 410. US Route 2 serves both Stevens Pass and Leavenworth, a Bavarian themed town of 2,263 people whose largest industry is tourism. Leavenworth drew 3.4 million visitors in 2024, 59 percent of them from the Seattle metro area. East of the crest, Mission Ridge sits 30 minutes from Wenatchee, a city of 35,508. Mt. Baker in Whatcom County holds the world record for snowfall in one season, set in the 1998 to 1999 season. White Pass lies 53 miles west of Yakima."
    culture_md: null
    alexandre_take_md: null
    status: draft
