  - target: cluster
    id: wasatch
    overview_md: "This cluster follows the Wasatch Range, and 85% of Utah's population lives near it, mainly along the Wasatch Front, home to just under 3 million people. Salt Lake City had 199,723 residents at the 2020 census and about 1.3 million in its metro area, and eight ski resorts lie close to the city. Alta and Snowbird sit in Little Cottonwood Canyon, and Brighton and Solitude sit in Big Cottonwood Canyon. Alta, a town of 228 people, is centered on a ski area with 500,000 annual visitors. Park City, on the Wasatch Back in Summit County, had 8,396 residents in 2020, and its tourist population on average greatly exceeds its permanent one. The former mining town rebounded through tourism in the 1980s and 1990s. By 2021 data it brought an average of $529.8 million a year to the Utah economy, $80 million of that from the Sundance Film Festival. Ogden, a city of 87,321 and home of Weber State University, has Snowbasin, Powder Mountain and Nordic Valley in the mountains to its east."
    culture_md: null
    alexandre_take_md: null
