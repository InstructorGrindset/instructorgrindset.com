  - target: cluster
    id: lake-tahoe
    overview_md: "Lake Tahoe straddles the California and Nevada border, and much of the area around it is devoted to tourism, with restaurants, ski slopes, golf courses and casinos. Most of the region's resorts sit at the north end near Truckee and Reno. Truckee had 16,729 residents in 2020, and 50.6% of its 13,374 housing units were vacant. Olympic Valley, home of Palisades Tahoe and the 1960 Winter Olympics, has about 924 year round residents and can swell to about 6,573 people overnight. Palisades Tahoe draws about 600,000 skiers a year. Incline Village, on the north shore, had 9,462 residents in 2020 and has some of the most expensive real estate in the country. Sugar Bowl, on Interstate 80 at Donner Pass, is one of the closest ski areas to the San Francisco Bay Area. South Lake Tahoe had 21,330 residents in 2020, and renters occupied 60.9% of its occupied homes. Its east end centers on tourism, Heavenly and the casinos of Stateline, Nevada. Reno, a city of 264,165, draws most of its California tourists from the Bay Area and Sacramento."
