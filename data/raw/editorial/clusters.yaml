  - target: cluster
    id: white-mountains
    overview_md: "The White Mountains cover about a quarter of New Hampshire and are heavily visited because they sit within reach of Boston, New York City and Montreal. In the east, Conway, the most populous town in Carroll County with 9,822 residents in 2020, is the county's main economic and commercial hub. Tourism is its biggest economic engine, and technology is its second largest source of jobs. Its village of North Conway, population 2,116, is known for outlet shopping and is the nighttime destination for skiers visiting Cranmore, Attitash, Black Mountain and Wildcat. Carroll County had 50,107 residents in 2020, and 42.9% of its housing units were vacant. To the west along Interstate 93, Lincoln, a town of 1,631, is the home of Loon Mountain and its recreation centered development. Cannon, owned by the state, sits in Franconia Notch State Park and has the largest vertical drop in New Hampshire. Waterville Valley, about 130 miles north of Boston, operates inside a planned resort community. Bretton Woods sits across from the Mount Washington Hotel, which owns it."
    culture_md: null
    alexandre_take_md: null
