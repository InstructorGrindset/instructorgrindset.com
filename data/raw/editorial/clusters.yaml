    source_ids: [ed-clusters-wikipedia-new-york-metropolitan-area, ed-clusters-wikipedia-vernon-township-new-jersey, ed-clusters-wikipedia-mountain-creek, ed-clusters-wikipedia-big-snow-american-dream, ed-clusters-wikipedia-campgaw-mountain, ed-clusters-wikipedia-mount-peter-new-york]
  - target: cluster
    id: catskills
    overview_md: "The Catskills rise in southeastern New York, largely inside Catskill Park, a forest preserve protected from many forms of development under state law. The region was a favored destination for New York City vacationers in the mid 20th century, when about 500 Borscht Belt summer resorts operated there. It has been a haven for artists, musicians and writers since the late 19th century, especially around Woodstock and Phoenicia. Hunter and Windham sit in Greene County, which had 47,931 residents in 2020. Hunter Mountain, about three hours from New York City, sits in the town of Hunter, population 3,035, and the ski resort is the largest employer in the village of Hunter. It was the first ski area in New York to install snowmaking. Windham Mountain Club, about 2.5 hours north of the city, sits in the town of Windham, population 1,708, nicknamed the Gem of the Catskills. Belleayre in Highmount is owned by the Olympic Regional Development Authority and recorded 237,825 visits in the 2022 to 2023 season. Plattekill in Roxbury is privately owned, and Holiday Mountain sits in Monticello."
    culture_md: null
