  - target: cluster
    id: southwest-montana
    overview_md: "Bozeman anchors this cluster. It is the seat of Gallatin County and the fourth largest city in Montana, with 53,293 residents at the 2020 census, and the county had 118,960. Top employers include Bozeman Health, Montana State University, Simms Fishing Products and many high tech, biotech and software firms. The area is noted for outdoor recreation, particularly skiing. Bridger Bowl, north of town, is a locally owned nonprofit area that serves Gallatin County residents and Montana State students. A blue beacon atop the Baxter Hotel downtown flashes when it gets fresh snow. Big Sky, southwest of Bozeman, is a community of 3,591 people in 2020, up from 2,308 in 2010. Tourism is its primary industry, and 57.3% of its 3,504 housing units were vacant in 2020. Big Sky Resort, about 50 miles from Bozeman, sits midway between Bozeman and West Yellowstone, the park entrance that handles around half of all Yellowstone visitors. The Yellowstone Club, a private residential club and ski resort with more than 500 member households as of 2014, borders Big Sky Resort and ties into its lifts."
    culture_md: null
    alexandre_take_md: null
    status: draft
    source_ids: [ed-clusters-wikipedia-bozeman-montana, ed-clusters-wikipedia-gallatin-county-montana, ed-clusters-wikipedia-bridger-bowl-ski-area, ed-clusters-wikipedia-big-sky-montana, ed-clusters-wikipedia-big-sky-resort, ed-clusters-wikipedia-yellowstone-club]
  - target: cluster
    id: tetons
    overview_md: "Jackson, the seat of Teton County, Wyoming, is the hub of this cluster. It had 10,760 residents at the 2020 census and is the largest incorporated town in Wyoming. Jackson is a popular tourist destination for its three ski areas, Jackson Hole Mountain Resort, Snow King and Grand Targhee, and a gateway to Grand Teton and Yellowstone National Parks. In 2010, arts, recreation, lodging and food services provided 32.2% of local jobs. Teton County is one of the highest income counties in the country. Its median home price was $1,060,093 in late 2021, and Zillow put Jackson's average home at $1,914,123 in September 2025. Snow King, the town hill on the edge of Jackson, opened in 1936 as the first ski area in Wyoming. Teton Village, population 517, surrounds the base of Jackson Hole Mountain Resort. West over Teton Pass, Teton Valley, Idaho, holds Victor, with 2,157 residents, and Driggs, with 1,984. Its economy is based in agriculture and ranching, with a shift toward recreational tourism. Grand Targhee is reached only from the west, through Driggs."
