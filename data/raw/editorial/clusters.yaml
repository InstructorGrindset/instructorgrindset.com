  - target: cluster
    id: southwest-colorado
    overview_md: "This cluster spans the San Juan Mountains and the Gunnison country of southwestern Colorado. Telluride, a former silver camp in a box canyon, had 2,607 residents at the 2020 census. Mining was its only industry until the first ski lift opened in 1972. A free gondola links it to Mountain Village, a town of 1,264 at the base of the ski area, where 61.8% of housing units were vacant in 2020. Summer in Telluride centers on festivals, including the Telluride Bluegrass Festival and the Telluride Film Festival, both held since 1974. Crested Butte, a former coal mining town of 1,639, now draws skiers and mountain bikers and hosts festivals throughout the year. Gunnison County had 16,918 residents in 2020, and 41.2% of its housing units were vacant. Purgatory sits 25 miles north of Durango, a city of 19,071 and home of Fort Lewis College. Silverton Mountain, near the historic mining town of Silverton, offers expert terrain from one chairlift plus helicopter skiing. Monarch sits on Monarch Pass west of Salida."
