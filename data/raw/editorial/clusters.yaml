  - target: cluster
    id: southern-california
    overview_md: "This cluster covers the ski areas of the San Bernardino and San Gabriel Mountains in Southern California. Big Bear Lake, a city on the south shore of its namesake lake, had about 5,046 residents at the 2020 census. The number of people staying in or visiting the Big Bear Valley surges past 100,000 on many weekends. In winter the town becomes a skiing and snowboarding destination for Southern California, with Snow Summit and Bear Mountain, which share management and lift tickets. Snow Summit is one of the most popular ski destinations for skiers from the Los Angeles area. Snow Valley in Running Springs is the longest continually operating ski resort in Southern California. Cities in the San Bernardino Mountains total about 44,000 people, a number that can rise tenfold in peak tourist season. In the San Gabriel Mountains, Mountain High sits on State Route 2 west of Wrightwood, a community of 4,720 in 2020, and is one of the most visited resorts in Southern California. Mt. Baldy sits on Mount San Antonio east northeast of Los Angeles."
