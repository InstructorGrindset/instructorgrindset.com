  - target: cluster
    id: eastern-sierra
    overview_md: "Mammoth Lakes is the main town in this cluster. It is the only incorporated town in Mono County and had 7,191 residents at the 2020 census, down 12.7% from 2010. Its economy is primarily tourism based, and the lodging industry generates around two thirds of the town's gross revenue. In 2020, 68.6% of its 9,330 housing units were vacant, and renters occupied 52.4% of the occupied homes. The median listing price was $752,000 in August 2022. Mammoth Mountain sits at the edge of town. Most of its skiers come from the Los Angeles area, since Bay Area drivers must cross four mountain passes to reach it. Summer camping, hiking and fishing bring a second season. June Mountain sits above June Lake, a community of 611 people where tourism is the chief industry and over half of private homes are second homes. Most of the June Mountain winter workforce lives in employee housing in Mammoth and rides a daily bus. China Peak sits on Huntington Lake northeast of Fresno, and Badger Pass is a small area inside Yosemite National Park."
