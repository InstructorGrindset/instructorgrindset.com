  - target: cluster
    id: roaring-fork
    overview_md: "The Roaring Fork Valley runs from Aspen down to Glenwood Springs and is one of the most affluent regions in Colorado. Its main economic engine is the Aspen Snowmass ski complex, four areas run by the Aspen Skiing Company. Skiing drives the valley's tourism, hospitality, retail, construction, real estate and property maintenance work. Aspen, a former silver mining camp, had 7,004 residents in 2020. It grew into an international ski resort and cultural center after 1946 and is home to the Aspen Music Festival and School. Its median single family home sold for $9.5 million in 2021, and nearby Snowmass Village, a relatively cheaper option, had a median of $5.2 million. Housing affordability is a severe challenge for workers. The Aspen Pitkin County Housing Authority runs deed restricted Employee Housing for people who live and work in the valley, yet even those homes can cost close to $1 million. Down valley sit Basalt, with 3,984 residents, Carbondale, with 6,434, and Glenwood Springs, with 9,963 and its hot springs. Sunlight Mountain sits south of Glenwood Springs."
