  - target: cluster
    id: northern-vermont
    overview_md: "This cluster runs along the northern Green Mountains. Stowe, a Lamoille County town of 5,223 at the 2020 census, is nicknamed the Ski Capital of the East. It was a summer resort by the mid nineteenth century, and Civilian Conservation Corps trail work on Mount Mansfield in the 1930s made it an early center of American downhill skiing. The Vermont Ski Museum is in town. Stowe Mountain Resort spans Mount Mansfield, the highest peak in Vermont, and Spruce Peak. Smugglers' Notch sits in Cambridge near Jeffersonville and draws skiers in winter and vacationers in summer. Jay Peak sits 4 miles from the Quebec border and gets the most snowfall of any ski area in the Northeastern US. As of 2022 it employed more than 1,200 people in winter and about half that number year round. Burke Mountain, in the Northeast Kingdom, is home to Burke Mountain Academy. Bolton Valley sits close to Burlington, the largest city in Vermont with 44,743 residents in 2020 and home to the University of Vermont and Champlain College."
