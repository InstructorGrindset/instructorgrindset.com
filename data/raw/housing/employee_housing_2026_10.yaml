# Employee housing that Tier A resorts or their operators publicly list (research batch, October 2026).
# Schema and rules: data/raw/housing/README.md. Values seen only in a search result that names its page are
# `estimated` with the note "From a search result for this page; page not opened".
# Daily and weekly rents are converted to monthly with lucrativeness.assumptions in config/definitions.yaml
# (days_per_month 30.4, weeks_per_month 4.33), rounded to the dollar; each rent note gives the published rate.
# Points: precision neighborhood uses the town or village point from Wikipedia, the resort base point already in
# the build, or a lift bottom station from the repository OpenSkiMap extract (data/raw/openskimap). A street address
# from a source is kept in `address`; the point stays neighborhood level unless a source gives the building's own
# coordinates.
batch: employee-housing-2026-10
researched_date: 2026-10-14
sources:
  # ---------------------------------------------------------------- Vail Resorts
  - {id: vr-careers-housing-overview, url: "https://jobs.vailresortscareers.com/content/Housing/?locale=en_US", title: "Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Lists the resorts with employee housing by region (Rockies, West, Northeast and others) and says housing is limited at many locations. Also names Heavenly's complex at 1100 Keller Road, Breckenridge housing at 1360 Airport Rd, Stowe's The Dorm and The Inn, and Sawmill Heights Apartments for Northstar."}
  - {id: vr-careers-heavenly-housing, url: "https://jobs.vailresortscareers.com/heavenly/content/heavenly-housing/", title: "Heavenly Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Employee housing complex at 1100 Keller Road, South Lake Tahoe, near the California Main Lodge; guidance of about $300 to $500 per person per month; residents 18 or older, a non drinking agreement for ages 18 to 21, and a commitment of at least three months."}
  - {id: vr-careers-breckenridge-housing, url: "https://jobs.vailresortscareers.com/breckenridge/content/Breckenridge-Housing/?locale=en_US", title: "Breckenridge Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Employee housing at 1360 Airport Rd, Breckenridge, CO 80424, or at Keystone; apartments with two people per bedroom."}
  - {id: vr-careers-keystone-housing, url: "https://jobs.vailresortscareers.com/keystone/content/Keystone-Housing/?locale=en_US", title: "Keystone Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The employee housing office is at 0065 Tennis Club Road, Keystone, CO 80435, and the complex sits within half a mile of the resort; guidance of about $600 to $1,000 per person per month; assigned to people with a formal job offer and a completed application."}
  - {id: vr-careers-stowe-housing, url: "https://jobs.vailresortscareers.com/stowe/content/Stowe-housing/?locale=en_US", title: "Stowe Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Limited on site housing at The Dorm and The Inn."}
  - {id: vr-careers-northstar-housing, url: "https://jobs.vailresortscareers.com/northstar/content/Northstar-Housing/?locale=en_US", title: "Northstar Housing (Jobs at Vail Resorts)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Points staff to Sawmill Heights Apartments, within the Northstar community."}
  - {id: kpcw-vail-441-beds-canyons-housing, url: "https://www.kpcw.org/summit-county/2022-04-12/vail-reserves-room-for-441-employees-in-new-canyons-housing-complex", title: "Vail reserves room for 441 employees in new Canyons housing complex (KPCW, 2022-04-12)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Vail Resorts is master lessee of 441 beds in the Canyons Village employee housing development, on a five year lease with two five year renewal options."}
  - {id: kpcw-slopeside-village-opens, url: "https://www.kpcw.org/summit-county/2023-10-12/slopeside-village-affordable-housing-opens-clearing-way-for-more-canyons-development", title: "Slopeside Village affordable housing opens, clearing way for more Canyons development (KPCW, 2023-10-12)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Opening report; rents from $436 to $1,100 a month, with priority for workers at top Canyons employers earning under 80% of area median income."}
  - {id: summitdaily-copper-employee-housing, url: "https://www.summitdaily.com/news/as-ski-season-nears-we-take-a-look-at-ski-resort-employee-housing-including-copper-mountains-new-project/", title: "As ski season nears, we take a look at ski resort employee housing, including Copper Mountain's new project (Summit Daily)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Copper Mountain's main employee housing facility, Edge, costs $337 a month for a double occupancy room and is within walking distance of the resort; the article also counts 1,800 shared Breckenridge and Keystone beds. Undated in the results; about 2023."}
  - {id: summitdaily-workforce-housing-at-resorts, url: "https://www.summitdaily.com/news/how-to-retain-resort-employees-colorado-ski-areas-are-building-workforce-housing-at-the-resorts/", title: "How to retain resort employees? Colorado ski areas are building workforce housing at the resorts (Summit Daily)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Copper Mountain finished Sky Chutes Landing in 2021: 44 studio, one, two and three bedroom apartments for 130 people."}
  # ---------------------------------------------------------------- Alterra Mountain Company
  - {id: deer-valley-employee-housing, url: "https://www.deervalley.com/jobs/housing", title: "Employee Housing (Deer Valley Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Four Park City locations on the free bus route, with 2026/27 winter rates charged per day per bed: Prospector (2045 Prospector Ave., dorm style, two or three per room, $25 double, $22 triple), Snowshoe Inn (1450 Empire Ave., two to four per room, near the base of Park City Mountain Village, same rates), Slopeside Village (1823 Ozzy Way, 4 and 10 bedroom furnished apartments near Canyons Village, $29 single, $27 double, at capacity for 26/27) and Snow Country Condominiums (1150 Deer Valley Dr., up to four per condo, $31, at capacity for 26/27). Utilities included; rent is deducted from the paycheck; limited by department and position."}
  - {id: steamboat-chamber-the-ponds, url: "https://www.steamboatchamber.com/listing/the-ponds-at-steamboat/2625/", title: "The Ponds at Steamboat (Steamboat Springs Chamber listing)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Employee housing for Steamboat Ski & Resort Corporation from November to April; non SSRC tenants only from May to September, by availability. The resort's own sources name no owner or lease for it."}
  - {id: unofficialnetworks-steamboat-hotels-2021, url: "https://unofficialnetworks.com/2021/10/28/steamboat-springs-to-use-local-hotels-for-affordable-housing/", title: "Steamboat Springs to use local hotels for affordable housing (Unofficial Networks, 2021-10-28)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The town council approved the closed Steamboat Hotel and the Steamboat Mountain Lodge as dormitory style housing for Steamboat Ski Corporation employees. A 2021 report; current use not confirmed."}
  - {id: winter-park-employee-housing, url: "https://www.winterparkresort.com/employment/employee-housing", title: "Employee Housing (Winter Park Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Fewer than 20% of resort employees live in employee housing; winter beds are allocated by department, all bedrooms are shared, and full time seasonal or year round staff ask their hiring manager about a spot."}
  - {id: milehighcre-winter-park-housing-opens, url: "https://milehighcre.com/winter-park-resort-opens-workforce-housing-to-first-residents/", title: "Winter Park Resort Opens Workforce Housing to First Residents (Mile High CRE)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Conifer Commons was completed in December 2023, with studio, one bedroom and two bedroom homes behind lockable doors and shared kitchens, bathrooms and living spaces."}
  - {id: denver-post-winter-park-housing-2023, url: "https://pressreader.com/usa/the-denver-post/20230111/281638194306731", title: "New housing for employees part of $40 million deal (The Denver Post via PressReader, 2023-01-11)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Current Winter Park employee housing includes Fraser Condominiums in Fraser at $420 to $450 per person per month and lodges near the resort at $400 to $450 per person per month."}
  - {id: schweitzer-employee-housing, url: "https://www.schweitzer.com/employment/schweitzer-employment/housing", title: "Employee Housing at Schweitzer Mountain Resort", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The Duplex near Schweitzer Village (three bedroom, two bath units, bunk beds, two employees per room) and the Hemlock House in Sandpoint (8 bedrooms, two employees each, a half bath per bedroom) at $350 to $700 a month; utilities and internet included; full time staff working 30 or more hours a week, first come first served. The employee housing application PDF on the same site gives $300 a month per employee for shared rooms and $600 for private rooms."}
  - {id: crystal-rodeway-inn-employee-housing, url: "https://www.crystalmountainresort.com/media/news/rodeway-inn-employee-housing", title: "Crystal Mountain acquires the Rodeway Inn for employee housing (Crystal Mountain news)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. As of February 20, 2026 the resort owns the Rodeway Inn in Enumclaw, renamed The Northway Notch, and will convert it to seasonal workforce housing for up to 80 employees from next winter, with employee transportation."}
  - {id: bbmr-employee-lodging, url: "https://www.bigbearmountainresort.com/employment/employee-housing", title: "BBMR Employee Lodging (Big Bear Mountain Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Current BBMR employees only; $600 a month for non coed shared housing with a $300 refundable deposit and utilities included; just minutes from Snow Summit and Bear Mountain; limited spots for the 26/27 winter. There is no employee housing in Running Springs; Snow Valley staff can live in the Big Bear Lake housing and ride the employee shuttle."}
  # ---------------------------------------------------------------- Aspen One (Aspen Skiing Company)
  - {id: aspen-one-housing-information, url: "https://aspen.com/?p=1490", title: "Housing Information (Aspen One)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Lists Sopris View Apartments in El Jebel and Thunder River Lodge and Keator Grove in Carbondale as long term employee housing, and Willits Hub and Aspen Basalt Campground as short term housing. The excerpt does not say which buildings the company owns and which it leases."}
  - {id: aspen-snowmass-hub-at-willits, url: "https://www.aspensnowmass.com/discover/experiences/stories/the-hub-at-willits", title: "The Hub at Willits (Aspen Snowmass)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. A 43 unit, 150 bed apartment complex in Willits Town Center, Basalt, 22 miles from downtown Aspen; 35 units for company employees and 8 for licensed childcare workers. Tenants moved in from Memorial Day weekend 2021."}
  - {id: aspen-snowmass-employment-faq, url: "https://www.aspensnowmass.com/employment/frequently-asked-questions", title: "Employment FAQ (Aspen Snowmass)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Over 1,300 beds across the Roaring Fork Valley; housing is limited, first season employees get preference, leases typically run 5.5 months, and employee housing is closed to ski and snowboard pros."}
  # ---------------------------------------------------------------- independents and other operators
  - {id: saminfo-jackson-hole-employee-housing, url: "https://www.saminfo.com/news/sam-headline-news/16726-397-jackson-hole-resort-adds-employee-housing", title: "Jackson Hole resort adds employee housing (SAM)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Powderhorn, the resort's first employee complex in West Jackson, houses 94 workers in furnished four bedroom units with lock off bedrooms; rents are set for seasonal budgets. Related reports (JH News&Guide, Buckrail) describe a second Powderhorn phase of 30 units and 90 beds planned for 2023 to 2024, and say housing goes only to full time employees with rent under 30% of gross income."}
  - {id: telluride-employee-housing, url: "https://tellurideskiresort.com/housing/", title: "Employee Housing (Telluride Ski Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Big Billie's, at the base of Lifts 1 and 10, has 146 furnished double occupancy studios, each with a kitchenette and private bathroom; residents ride the chondola, bus and gondola free."}
  - {id: coolworks-sun-valley, url: "https://coolworks.com/sun-valley/profile", title: "Sun Valley Resort employer profile (Cool Works)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Dormitory accommodation for full time employees on site at about $210 a month; the benefits section of the same page says about $280 a month; utilities, WiFi, washer and dryer, and linens included."}
  - {id: big-sky-mountain-lodge-east, url: "https://bigskyresort.com/press-releases/big-sky-resort-completes-final-phase-of-mountain-lodge-east-workforce-housing-complex", title: "Big Sky Resort completes final phase of Mountain Lodge East workforce housing complex (Big Sky Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The final phase completes the 186 bed complex in Mountain Village, walkable to the ski slopes."}
  - {id: big-sky-redefining-employee-living, url: "https://www.bigskyresort.com/blog/redefining-employee-living", title: "Redefining Employee Living (Big Sky Resort blog)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Levinski Lodge is a three building campus beside Lake Levinsky with more than 200 beds within a 5 minute walk of the resort; Big Sky Resort houses over half its peak workforce in 1,011 employee beds. Rates are 48% to 60% of market rent."}
  - {id: explorebigsky-black-bear-employee-housing, url: "https://www.explorebigsky.com/resort-turns-storied-bar-and-grill-into-employee-housing", title: "Resort turns storied bar and grill into employee housing (Explore Big Sky)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The former Black Bear Bar and Grill building in Mountain Village is being converted to add 44 employee beds. It also names the Golden Eagle Lodge in Meadow Village and the Mountain Lodge as existing employee dorms; this batch has no sourced point for those two."}
  - {id: taosnews-tsv-workforce-housing-2024, url: "https://www.taosnews.com/news/business/tsv-inc-to-expand-workforce-housing-by-30-percent-this-year/article_79f82bbf-231d-56cf-9f4c-d550b5100cdf.html", title: "TSV Inc. to expand workforce housing by 30 percent this year (Taos News)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The resort planned to grow housing from 150 to 200 staff by fall 2024, partly by expanding the Amizette Inn for 16 more employees that fall and 20 more in 2025. The search attributed these figures to a 2024 announcement; Snow Industry News carried a similar report."}
  - {id: mainebiz-sugarloaf-herbert-grand, url: "https://mainebiz.biz/article/sugarloaf-buys-kingfields-storied-herbert-grand-hotel-will-use-it-for-workforce-housing/", title: "Sugarloaf buys Kingfield's storied Herbert Grand Hotel, will use it for workforce housing (Mainebiz)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The hotel in Kingfield, about 15 miles from the resort, has 26 guest rooms, communal areas and a small restaurant. NewsCenter Maine reported the resort bought a nearby hotel for up to 60 staff."}
  - {id: killington-employment, url: "https://killington.com/employment", title: "Employment (Killington Resort)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Names The Hillside, The Chalet, The Killington Motel and Mendon Mountain View Lodge as employee housing; $125.00 per person per week for a double room; move in cost of a $300 refundable security deposit plus the first two weeks' rent ($250 for a double). Undated. Mountain Times reported the resort bought Mendon Mountain View Lodge in 2018 and the 90 room Hillside Inn in April 2022."}
  - {id: bendbulletin-mt-bachelor-campfire, url: "https://bendbulletin.com/?p=495039", title: "Mt. Bachelor announces housing partnership with Campfire Hotel (The Bulletin)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. A 2023 partnership gives subsidized single or double rooms at the Campfire Hotel in Bend to 52 full time seasonal employees; the resort did not release the price."}
  - {id: opb-mt-bachelor-housing-2026, url: "https://www.opb.org/article/2026/01/20/central-oregon-mt-bachelor-housing-seasonal-work/", title: "Mt. Bachelor seasonal worker housing (OPB, 2026-01-20)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. The resort and hotel have provided low cost December to April housing to some seasonal workers for three years."}
  - {id: saminfo-waterville-employee-housing, url: "https://www.saminfo.com/news/sam-headline-news/waterville-valley-resort-invests-in-employee-housing", title: "Waterville Valley Resort invests in employee housing (SAM)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. In 2016 the resort and General Properties, LLC bought the Snow Star Inn, 2.5 miles from the resort, for workforce housing: about 40 units in bunk, hotel and condo styles, with transport to the resort."}
  - {id: alaskapublic-alyeska-village-2023, url: "https://alaskapublic.org/news/2023-12-13/alyeska-ski-resort-plans-to-build-a-new-community-complex-filled-with-shops-condos-and-an-ice-rink", title: "Alyeska ski resort plans a new community complex (Alaska Public Media, 2023-12-13)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Reports that the resort recently completed 71 staff housing units in Girdwood."}
  - {id: adn-alaska-employer-housing-2022, url: "https://www.adn.com/business-economy/2022/06/19/alaska-workers-face-a-housing-crisis-in-some-communities-employers-hope-that-if-they-build-it-employees-will-come/", title: "Alaska workers face a housing crisis; employers hope that if they build it, employees will come (Anchorage Daily News, 2022-06-19)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Alyeska Resort was building a $6.6 million facility for middle management employees: about 70 studio and one bedroom apartments for 120 people."}
  - {id: wikipedia-gallatin-gateway-inn, url: "https://en.wikipedia.org/wiki/Gallatin_Gateway_Inn", title: "Gallatin Gateway Inn (Wikipedia)", accessed_date: 2026-10-14, note: "Article text read 2026-10-14 through action=raw. Infobox location U.S. 191, Gallatin Gateway, Montana, coordinates 45 35 37 N, 111 11 54 W (the building, an NRHP listing). In 2015 the building was leased to the Yellowstone Club to house Yellowstone Club, Spanish Peaks Mountain Club and Moonlight Basin employees."}
  - {id: idahoworks-yellowstone-club-housing, url: "https://idahoworks.gov/jobs/2593013", title: "Yellowstone Club seasonal job posting (IdahoWorks)", accessed_date: 2026-10-14, note: "From a search result for this page; page not opened. Winter 2026/2027 posting: several employee housing venues, including the Gallatin Gateway Inn with Schack's Depot dinner service; $225.00 to $700.00 biweekly depending on location and room style, single or double occupancy, a refundable deposit of $250 to $400, booked through StarRez, with shuttles to the club."}
