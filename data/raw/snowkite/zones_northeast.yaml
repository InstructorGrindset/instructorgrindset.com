- id: lake-winnipesaukee-nh
  name: Lake Winnipesaukee
  status: established
  kind: lake
  state: NH
  location: {lat: 43.6, lon: -71.33333333, precision: area, source_id: snowkite-ne-wp-winnipesaukee, as_of: 2026-11-28, confidence: reported}
  surface: [frozen_lake]
  wind:
    value: An operator guide says winds from any direction other than south and west work best at the Ellacoya launch. The guide notes that lakes have their own weather.
    source_id: snowkite-ne-hardwater-article
    as_of: 2026-11-28
    confidence: estimated
  snow_ice:
    value: An iceboat club measured 4 to 5 inches of ice over the areas checked at Ellacoya in January 2020. A single dated report.
    source_id: snowkite-ne-iceboat-winni
    as_of: 2026-11-28
    confidence: estimated
  terrain:
    value: The Broads is the widest part of the lake. Ellacoya State Park on the southwest shore gives direct access to The Broads for all day cruising.
    source_id: snowkite-ne-hardwater-article
    as_of: 2026-11-28
    confidence: estimated
  hazards:
  - value: The Broads is typically the last part of the lake to freeze, and open water can remain in cold winters.
    source_id: snowkite-ne-nhpr-winni
    as_of: 2026-11-28
    confidence: estimated
  access:
    road: Ellacoya State Park on the southwest side of the lake, the most common and accessible launch
    source_id: snowkite-ne-hardwater-article
    as_of: 2026-11-28
    confidence: estimated
  report:
    status: draft
    summary: A snowkite operator names Lake Winnipesaukee among New England's top snowkiting lakes and calls Ellacoya State Park the most common launch. From Ellacoya, kiters reach The Broads for all day cruising. The Broads is typically the last part of the lake to freeze, so ice checks come first.
    source_ids: [snowkite-ne-hardwater-article, snowkite-ne-nhpr-winni, snowkite-ne-marriott-hotspots]
