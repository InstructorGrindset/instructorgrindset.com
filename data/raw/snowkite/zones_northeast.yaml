zones:
- id: lake-champlain-sand-bar-vt
  name: Lake Champlain at Sand Bar, Milton
  status: established
  kind: lake
  state: VT
  location: {lat: 44.62709, lon: -73.23985, precision: area, source_id: snowkite-ne-wp-sandbar, as_of: 2026-11-28, confidence: reported}
  surface: [frozen_lake]
  wind:
    value: Wide open spaces and steady wind. A regional guide says some of the smoothest wind in the region is on Champlain.
    source_id: snowkite-ne-lcc-champlain
    as_of: 2026-11-28
    confidence: estimated
  snow_ice:
    value: A good snow on ice base layer. Most snowkiters stay in the protected bays, where the ice is thickest and most reliable.
    source_id: snowkite-ne-lcc-champlain
    as_of: 2026-11-28
    confidence: estimated
  terrain:
    value: Wide open lake with room to ride for hours. A source says 15 to 20 snowkiters can share the lake near Sand Bar on a windy winter day.
    source_id: snowkite-ne-sevendays-lofty
    as_of: 2026-11-28
    confidence: estimated
  hazards:
  - value: Hard ice raises injury risk on bad landings. A local kiter recommends learning lake ice dynamics and carrying crampons and ice awls.
    source_id: snowkite-ne-newengland-2009
    as_of: 2026-11-28
    confidence: estimated
  - value: Thicker snow cover cushions falls. Thin snow over hard ice is the harder surface.
    source_id: snowkite-ne-lcc-champlain
    as_of: 2026-11-28
    confidence: estimated
  access:
    road: Sand Bar State Park in Milton, on the Lake Champlain shore
    parking: The state park lists a summer day use season from Memorial Day weekend to Labor Day weekend; confirm winter lake access with the park
    source_id: snowkite-ne-vtstateparks-sandbar
    as_of: 2026-11-28
    confidence: estimated
  report:
    status: draft
    summary: The Lake Champlain Committee names Sand Bar State Park in Milton as a favorite place for many snowkiters. The lake offers wide open space, steady wind and a good snow on ice base. A local source reports 15 to 20 snowkiters on the lake on a windy winter day.
    source_ids: [snowkite-ne-lcc-champlain, snowkite-ne-sevendays-lofty]
