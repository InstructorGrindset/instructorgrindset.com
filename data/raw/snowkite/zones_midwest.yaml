- id: mille-lacs-lake-mn
  events: [mille-lacs-kite-crossing]
  name: Mille Lacs Lake
  status: established
  kind: lake
  state: MN
  location:
    lat: 46.23813
    lon: -93.64341
    precision: area
    source_id: snowkite-mw-wp-mille-lacs
    as_of: *id001
    confidence: reported
  surface:
  - frozen_lake
  months:
    value:
    - 1
    - 2
    - 3
    note: Best snow and ice for kiteboarding is usually late January until early March, per the local tourism site
    source_id: snowkite-mw-mn-mille-lacs-tourism
    as_of: *id001
    confidence: estimated
  wind:
    value: Steady winds over a large open lake. The tourism site notes multiple public access points on each side of the lake.
    source_id: snowkite-mw-mn-mille-lacs-tourism
    as_of: *id001
    confidence: estimated
  snow_ice:
    value: An AP report names 5 to 6 inches of fresh snow and 12 to 15 knots of wind as ideal for the Kite Crossing race.
    source_id: snowkite-mw-mn-mille-lacs-mpr-2020
    as_of: *id001
    confidence: estimated
  terrain:
    value: A race course of about 28 miles across the lake and back is used by the Kite Crossing, with shorter races, freestyle and lessons.
    source_id: snowkite-mw-mn-mille-lacs-startribune
    as_of: *id001
    confidence: estimated
  hazards:
  - value: Clear ice makes falls harder. Racers meet ice heaves and other kiters. Racers carry long ice screws to anchor a kite if they stop.
    source_id: snowkite-mw-mn-mille-lacs-mpr-2020
    as_of: *id001
    confidence: estimated
  - value: 'Minnesota DNR minimum for new clear ice: about 4 inches on foot and 5 to 7 inches for snowmobiles. Double the figures for white ice. The DNR does not measure lake ice.'
    source_id: snowkite-mw-mn-dnr-thickness
    as_of: *id001
    confidence: estimated
  - value: Ice over flowing water is often dangerous near streams, springs, channels between lakes, bridges and culverts. Pressure ridges can reach over 10 feet; follow them at a distance to find a crossing.
    source_id: snowkite-mw-mn-dnr-thin-ice
    as_of: *id001
    confidence: estimated
  access:
    road: Multiple public access points on each side of the lake
    source_id: snowkite-mw-mn-mille-lacs-tourism
    as_of: *id001
    confidence: estimated
  website:
    value: https://millelacs.com/kiteboarding/
    source_id: snowkite-mw-mn-mille-lacs-tourism
    as_of: *id001
    confidence: estimated
  report:
    status: draft
    summary: Mille Lacs is the best known snowkite lake in Minnesota. It hosts the Kite Crossing, a race of about 28 miles across the lake and back. The local tourism site gives late January to early March as the usual window.
    source_ids:
    - snowkite-mw-mn-mille-lacs-tourism
    - snowkite-mw-mn-mille-lacs-startribune
    - snowkite-mw-mn-mille-lacs-mpr-2020
