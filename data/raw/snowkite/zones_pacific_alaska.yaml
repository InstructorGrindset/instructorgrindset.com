zones:
- id: thompson-pass-ak
  name: Thompson Pass
  status: established
  kind: other
  state: AK
  location:
    lat: 61.1286
    lon: -145.7297
    precision: area
    source_id: snowkite-pak-wp-thompson-pass
    as_of: 2026-11-28
    confidence: reported
  surface:
  - open_snowfield
  - frozen_lake
  - frozen_river
  months:
    value:
    - 3
    - 4
    source_id: snowkite-pak-thekitemag-alaska
    as_of: 2026-11-28
    confidence: estimated
    note: Late March is named as the best time; the festival runs in April
  wind:
    value: Wind funnels through the pass and lets kiters ride up steep mountain slopes
    source_id: snowkite-pak-valdez-snowkiting
    as_of: 2026-11-28
    confidence: estimated
  snow_ice:
    value: Frozen lakes and rivers such as Odyssey Lake, Blueberry Lake, the Lowe River and Glacier Stream suit learning when the surface is soft
    source_id: snowkite-pak-visitvaldez-snow-kiting
    as_of: 2026-11-28
    confidence: estimated
  terrain:
    value: Kiters ride lakes, rivers and mountain slopes about 30 miles from Valdez; Odyssey Lake is the usual learning area
    source_id: snowkite-pak-visitvaldez-snow-kiting
    as_of: 2026-11-28
    confidence: estimated
  access:
    road: Richardson Highway, Thompson Pass about 30 miles from Valdez
    parking: Odyssey Lake lot at Milepost 26.5 (festival site)
    source_id: snowkite-pak-valdez-snowkite-festival
    as_of: 2026-11-28
    confidence: estimated
  website:
    value: https://www.valdezalaska.org/plan/things-to-do/winter-activities/snowkiting/
    source_id: snowkite-pak-valdez-snowkiting
    as_of: 2026-11-28
    confidence: estimated
  report:
    status: draft
    summary: Valdez tourism sources call Thompson Pass a world class snowkiting spot, where wind pulls riders on skis or snowboards across snow. Kiters from around the world have come since the early 2000s. The Alaska Snowkite Festival and beginner clinics run in early April at the Odyssey Lake lot.
    source_ids:
    - snowkite-pak-valdez-snowkiting
    - snowkite-pak-visitvaldez-snow-kiting
    - snowkite-pak-valdez-snowkite-festival
