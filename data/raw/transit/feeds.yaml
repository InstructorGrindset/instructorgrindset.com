# GTFS feeds for agencies serving Tier A clusters (ROADMAP Section 8, item 16).
# Researched 2026-10-13 from the Mobility Database catalog (sources.csv, updated 2026-10-13):
# https://storage.googleapis.com/download/storage/v1/b/mdb-csv/o/sources.csv?alt=media
#
# url:            the agency's own feed (urls.direct_download); it becomes the source url gtfs-<agency>
# mirror_url:     the catalog's latest copy (urls.latest); `fetch` tries it first because the agency
#                 hosts are unreachable from the build environment
# mdb_source_id:  the catalog id
# license:        urls.license from the catalog; null when the catalog lists none
# agency_ids:     optional; keep only these GTFS agencies of a shared feed
#
# Feeds checked and left out (stale, no stop near a Tier A base, or not in the catalog) are listed in
# README.md. Validity dates are read from each zip by `python -m pipeline.transit check`.
feeds:
