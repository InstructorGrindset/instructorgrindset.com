# Multi resort pass membership for the 2026/27 season (ROADMAP item 12: Epic and Ikon pass filter).
#
# Sources are the pass companies' own sites: epicpass.com (Vail Resorts), ikonpass.com and its blog
# lifted.ikonpass.com (Alterra Mountain Company), and mountaincollective.com. These sites are blocked from the
# research environment, so every value comes from a web search result that named the page (search result rule:
# confidence estimated, note "From a search result for this page; page not opened"). Wikipedia (read in full via
# action=raw) is cited only for which mountains make up a multi mountain pass destination; it has no pass list.
#
# Rules followed:
# * A pass is never inferred from ownership. Every Vail Resorts resort below is listed by an Epic Pass page and
#   every Alterra resort by an Ikon Pass page. Ikon partner resorts that Alterra does not own are listed the same way.
# * access describes the top pass of each family (the Epic Pass, the Ikon Pass, the Mountain Collective pass):
#   unlimited, limited (days when the page states a number) or unspecified (the page lists the resort without days).
#   blackout is set only when the page says whether blackout or restricted dates apply to that pass.
# * Destinations made of several mountains map to each mountain record only when a source names the mountains.
#   Summit at Snoqualmie: Alpental and Summit West have records; the Three Summits record is a separate
#   OpenSkiMap area whose identity is unclear, so it is left out. Mountain Collective's Sun Valley maps to Bald
#   Mountain only (no source names Dollar Mountain for that pass).
# * Indy Pass is not researched in this batch (about 200 destinations; the search budget would cover a fraction).
#   Mountain Collective covers its 13 US destinations from the pass's own homepage.
batch: passes-2026-27
researched_date: 2026-10-13
