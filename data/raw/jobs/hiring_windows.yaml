# Hiring windows for Tier A resorts (ROADMAP Section 8, item 6): when applications open, job fairs and when
# clinics start, each in its source's own words. Copied verbatim from the pay and training research sidecar
# (training-sidecar.yaml, researched 2026-10-13) at the coordinator's request; the text is never reworded.
# Every source is declared in data/raw/facts/training.yaml, data/raw/pay or data/raw/jobs. Search result values are
# estimated (search result rule). Format: docs/map/ARCHITECTURE.md, "Webcams and jobs".
