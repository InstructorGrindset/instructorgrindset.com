batch: facilities
researched_date: 2026-10-11
status: draft            # Alexandre approves later
# Indoor snow and year round training facilities (ROADMAP Section 3, year_round_training criterion).
# The egress policy of the research session allowed only en.wikipedia.org, so every fact here comes
# from Wikipedia (or the repository's OpenSkiMap extract for coordinates). Operator sites were blocked
# (bigsnowamericandream.com, timberlinelodge.com, utaholympiclegacy.org, usskiandsnowboard.org,
# woodwardparkcity.com, coppercolorado.com, orda.org) and should be checked before approval.
