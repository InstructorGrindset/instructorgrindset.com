batch: candidates-west
researched_date: 2026-10-11
status: draft            # for Alexandre's approval
# Western US independents and non Vail, non Alterra operators. All values come from Wikipedia
# pages fetched on 2026-10-11 through the Wikipedia API. Resort and operator websites were
# blocked by the research environment's egress policy (HTTP 403), so ownership is NOT yet
# confirmed on each resort's own site; owners taken from Wikipedia carry a note.
# lat/lon are the Wikipedia infobox coordinates, used as the base area point.
#
# Researched and left out (no fetched source supports a Tier A criterion as written):
#   loveland (CO): opened 1936, Pete Seibert was GM in 1955; local favourite near Denver. State level history only.
#   monarch (CO): opened 1939, "Bloody Ridge" legend; article flagged promotional. No criterion.
#   snow-king (WY): first ski area in Wyoming (1939), Jackson Hole Ski Club 1937. State level history only.
#   brundage (ID): Corey Engen laid out trails; no criterion.
#   mt-rose (NV): hosted the inaugural NCAA Skiing Championships (1954) and was the 1960 Olympic alternate
#                 downhill site. Borderline heritage; the owner declined it.
#   arizona-snowbowl (AZ): article covers the sacred peaks litigation and reclaimed water snowmaking only.
#   ski-santa-fe (NM): first rope tow in New Mexico (1936), Ernie Blake managed it in 1950. State level history only.
#   angel-fire (NM): ownership and finance history only.
#   wolf-creek (CO): most snowfall in Colorado; snowfall alone is not a criterion.
#   sundance (UT), purgatory (CO), beaver-mountain (UT), mt-hood-skibowl (OR): no criterion in their articles.
