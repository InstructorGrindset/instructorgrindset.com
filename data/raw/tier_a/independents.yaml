# All values come from Wikipedia pages fetched on 2026-10-11. Resort sites were unreachable from
# the research environment, so ownership is not yet confirmed on each resort's own site.
# lat/lon are the Wikipedia infobox coordinates, used as the base area point.
#
# Candidates researched but left out because no fetched source supports a Tier A criterion
# (the build requires at least one criterion per record). Flagged for Alexandre:
#   buttermilk  (Aspen Skiing Company, CO, roaring-fork): article notes X Games hosting and
#               a beginner focus only. 39.205, -106.86056; 435 acres; 2,030 ft; 8 lifts.
#   snowmass    (Aspen Skiing Company, CO, roaring-fork): article gives no criterion evidence.
#               39.1956, -106.9513; 3,362 acres; 4,406 ft; 16 lifts.
#   taos        (Louis Bacon / Taos Ski Valley, Inc. since Dec 2013, NM, northern-new-mexico):
#               article says founded 1955 by Ernie and Rhoda Blake, home of a highly rated ski
#               school, banned snowboarding until 2008; none of that meets a criterion as stated.
#               36.59, -105.43694; 1,294 acres; 3,281 ft; 14 lifts.
#   big-sky     (Boyne Resorts, MT, southwest-montana): article gives size and lift history only.
#               45.275, -111.4319; 5,850 acres; 4,350 ft; 40 lifts.
