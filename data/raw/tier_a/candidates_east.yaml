status: draft
# Eastern and Midwest Tier A candidates, drafted for owner approval.
# All values come from Wikipedia pages fetched on 2026-10-11 (resort, operator and news sites
# were blocked by the research environment's proxy), so ownership is not yet confirmed on each
# resort's own site. lat/lon are the Wikipedia infobox coordinates, used as the base area point.
# Nothing here is owned or operated by Vail Resorts or Alterra (covered in vail.yaml and alterra.yaml).
#
# Researched and left out because no fetched source supports a criterion as written:
#   gore (ORDA, NY): largest ski area in NY; Ski magazine "Top 10 for Value" only.
#   windham (Beall Investment Partners and partners, NY): 2023 rebrand to Windham Mountain Club;
#       the article gives no clientele, pricing or private lesson evidence.
#   belleayre (ORDA, NY): New York's first chairlift; state level only.
#   holiday-valley (NY): family oriented resort, no criterion.
#   smugglers-notch (VT): family amenities and ski school rankings only. Ownership conflict:
#       its own article names William Stritzler; the Berkshire East article reports Bear Den
#       Partners bought a majority stake on 2026-02-11.
#   bolton-valley, bromley, saddleback, mount-abram, jiminy-peak, loon, bretton-woods,
#   camelback, lutsen, granite-peak, spirit-mountain, black-mountain-nh, camden-snow-bowl,
#   mohawk-mountain, bousquet, dartmouth-skiway, plattekill, pats-peak, wachusett:
#       size, history or regional firsts only.
#   blue-mountain-pa (BMR Resort, affiliated with KSL Resorts): USSA race team claim is marked
#       citation needed and names no national team outcome.
#   Ski jumps (Pine Mountain Jump MI, Copper Peak MI, Snowflake WI) are jumping hills, not ski
#       areas; flagged for the training facility batch.
